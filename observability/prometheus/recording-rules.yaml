groups:
  - name: verify-gate
    rules:
      - record: job:verify_gate_ssrf_block_rate_5m
        expr: rate(verify_gate_ssrf_block_total[5m])
      - record: job:verify_gate_token_fail_rate_5m
        expr: rate(verify_gate_token_fail_total[5m])
      - record: job:verify_gate_idem_hits_rate_5m
        expr: rate(verify_gate_idem_hits_total[5m])
      - record: rate:verify_gate_redirect_block_total_5m
        expr: rate(verify_gate_redirect_block_total[5m])
      - record: rate:verify_gate_redirect_follow_total_5m
        expr: rate(verify_gate_redirect_follow_total[5m])
      - record: rate:verify_gate_ip_mismatch_total_5m
        expr: rate(verify_gate_ip_mismatch_total[5m])
      - record: rate:verify_gate_tls_name_mismatch_total_5m
        expr: rate(verify_gate_tls_name_mismatch_total[5m])
      - record: p95:verify_gate_dns_ttl_pinned_seconds
        expr: histogram_quantile(0.95, sum(rate(verify_gate_dns_ttl_pinned_seconds_bucket[5m])) by (le))
  - name: ethics
    rules:
      - record: job:ethics_degraded_rate_5m
        expr: rate(ethics_degraded_total[5m])
