- commit: >-
    Der *ArchetypeAnalyzer* dient der Analyse von Gesprächsinhalten nach
    archetypischen Mustern und Schattenaspekten【51†L4-L8】. Manifest: Eintrag
    analog, z. B. `name: ArchetypeAnalyzer`, `entry: agents/archetype/main.py`.
    Der Agent-Skeleton in `agents/archetype/main.py` enthält
    Platzhalterfunktionen wie `analyze_archetypes(conversation)`, die einen
    Gesprächsverlauf oder Textabschnitt nimmt und nach vordefinierten Mustern
    (Myers-Briggs Archetypen, Heldenreise-Rollen o. ä.) klassifiziert.
    Integration: Der EventBus kann z. B. ein Event `archetypePatternDetected`
    empfangen, wenn markante Muster gefunden wurden. Diese Technik integriert
    sich mit dem **Symbolik-Layer** – Ergebnisse fließen in die Sigillin- oder
    Symbolzuweisung. Der Orchestrator könnte den Analyzer bei bestimmten Tiefen
    (Tiefe der Konversation) aktivieren, etwa wenn das System in einen
    Reflexionsmodus geht. Test & Deploy: Testdaten sind Gesprächsausschnitte mit
    erwarteten Archetypen (z. B. „Mentor-Schüler“-Dialog erkennen). Deployment
    erfordert zusätzlich eine Abstimmung mit dem **EthicGuardian** (Technik 3),
    da Archetypen-Ergebnisse evtl. ethische Bewertungen beeinflussen.
