- commit: >-
    Der *Synchronizer* sorgt für die **Synchronisierung zeitlicher und
    räumlicher Kontexte**【51†L8-L11】 im System. Beispielsweise kann er
    sicherstellen, dass Agenten mit Echtzeitdaten (Uhrzeit, Kalender, ggf.
    Standort) versorgt werden, um konsistente Antworten zu liefern.
    Manifest-Eintrag: z. B. `name: Synchronizer`, `schedule: "* * * * *"` (als
    Cron-ähnlicher Trigger jede Minute, falls Periodizität gewünscht). Im
    Skeleton `agents/synchronizer/main.py` gibt es eine Funktion
    `sync_context()` die z. B. aktuelle Zeitstempel, ggf. Wetterdaten, etc. holt
    und an die EventBus verteilt (etwa Event `contextSync`). Integration: Der
    EventBus leitet `contextSync` an alle interessierten Module (z. B. ein
    **VR-Meetingraum** könnte das für Tag/Nacht-Zyklus brauchen, oder ein
    **PantheonNavigator** für kosmische Zeit-Symbole). Der Orchestrator stellt
    sicher, dass **vor** wichtigen Aktionen (wie dem Start einer komplexen
    Berechnung oder dem täglichen Reset) einmal die Synchronisierung läuft.
    UI-seitig könnte man synchronisierte Status (z. B. "Aktuelle Weltzeit:
    18:30, Kalenderwoche 32") irgendwo anzeigen. Test & Deploy: Test, ob
    `sync_context()` tatsächlich die Daten beschafft und korrekt verteilt (Mocks
    für externe APIs, falls genutzt, oder Systemzeit einfrieren). Deployment:
    Falls externe Datenquellen (APIs für Geo/Wetter) angebunden werden, müssen
    API-Keys konfiguriert sein; ansonsten primär Systemzeit nutzen.
  path: ''
