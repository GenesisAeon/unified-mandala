- commit: >-
    - **Aufgabenübergabe an Agenten und Codex-Systeme:** UnifiedMandala
    unterstützt fließende Übergaben von Aufgaben zwischen Mensch und KI-Agenten.
    In der Praxis kann ein Mensch im Dialog eine komplexe Aufgabe stellen, und
    das System verteilt die Teilaufgaben an spezialisierte Agenten. Zum Beispiel
    könnte ein:e Nutzer:in im Chat einen Plan skizzieren (*„Baue mir einen
    Web-Service und visualisiere die Daten“*). Daraufhin identifiziert der
    Orchestrator die Programmieranteile und lässt einen Codex-ähnlichen Agenten
    (z. B. *Mistral-Devstral*) den Code generieren【2†L23-L27】. Gleichzeitig wird
    ein *Boundary-Agent* aktiviert, der die Einhaltung von Vorgaben oder
    Sicherheitsregeln überwacht【2†L25-L29】. Sobald der Code erstellt ist, kann
    das System diesen mittels *ChatGPT* erklären oder optimieren lassen. Diese
    Übergabe geschieht oft implizit: Der Benutzer muss keinen konkreten Agenten
    ansprechen – **natürliche Sprache** genügt, um den richtigen Prozess
    anzustoßen. Intern sorgen *Sigillin* oder Heuristiken dafür, dass die
    Anfrage dem passenden Modul zugeleitet wird. Darüber hinaus gibt es CLI- und
    YAML-gestützte Workflows für Entwickler: Mit dem *FractalTaskRunner* können
    komplexe Aufgabenketten vordefiniert und per Befehl ausgeführt
    werden【8†L63-L66】. So könnte ein Team bestimmte Routineaufgaben (Codieren,
    Testen, Deployment) als YAML-Workflow hinterlegen und im Chat mit einem
    einzigen Kommando an einen Agenten übergeben, der diesen Workflow autonom
    abarbeitet.
