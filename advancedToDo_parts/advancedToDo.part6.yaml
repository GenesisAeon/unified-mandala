- commit: >-
    Der *SymbolMapper*-Agent übersetzt numerische und textuelle Muster in
    definierte Symbol-Glyphen【15†L53-L61】. Er schließt die Lücke zwischen
    quantitativen Werten (z. B. statistische Ergebnisse, Scores) und der
    symbolischen **Sigillin-Sprache** des Systems. Manifest-Spezifikation: Der
    SymbolMapper v1 hat Methoden `map_numeric_to_symbol` und
    `map_text_to_glyph`【15†L55-L63】. Im Python-Skeleton
    (`agents/symbolmapper/main.py`) implementieren wir z. B. eine Liste
    vordefinierter Glyphen (im Manifest-Beispiel: ○, ∆, ψ, ★【15†L67-L73】) und
    die Abbildungsfunktionen analog zum YAML-Snippet: ein Durchschnittswert wird
    auf einen Index im Glyphen-Array gemappt【15†L67-L75】, Texte werden auf Basis
    von Schlüsselbegriffen einem Symbol zugeordnet (Bsp: enthält der Text
    "Erweckung", dann ★ als Glyph)【15†L69-L73】. Integration: Dieser Agent kann
    von anderen Modulen genutzt werden, die rohe Daten symbolisch darstellen
    wollen – z. B. der CREPBridge könnte SymbolMapper fragen, welcher Glyph
    einem bestimmten Score entspricht (um dann einen Sigil zu generieren). Auch
    für Graphen/Charts in der UI könnte SymbolMapper herangezogen werden, um
    interessante Datenpunkte mit Symbolen zu markieren. Orchestrator:
    wahrscheinlich auf Abruf, nicht dauernd laufend – d.h. Module rufen ihn als
    Library auf (alternativ EventBus-Request/Reply-Pattern). UI: Keine direkte,
    aber z. B. im Sigil-Portfolio des Nutzers könnten diese Glyphen vorkommen.
    Test & Deploy: Test, ob gegebene Werte die richtigen Symbole liefern (z. B.
    Eingabe [0.1, 0.9] ergibt einen Index im gültigen Bereich und ein Symbol aus
    der Liste【15†L137-L142】). Deployment: Sicherstellen, dass NumPy verfügbar
    ist (im Manifest als Dependency angegeben【15†L61-L69】) und dass das System
    die Unicode-Symbole unterstützt (Fonts in UI etc.).
