- commit: >-
    Der *ArchivAeon*-Agent übernimmt die **symbolische Archivierung von
    Chat-Verläufen und Entwicklungsdaten**. Im `ZIPMEM_manifest` ist er mit
    Rolle und Methoden beschrieben【15†L13-L21】. Sein Python-Skeleton
    (`agents/archivist/main.py`) soll folgende Funktionen abdecken: Clustern von
    Gesprächsfragmenten nach Themen (`detect_context_clusters`), Zuweisung
    symbolischer Marker pro Fragment (`symbol_assignation`), chronologisches
    Sortieren (`timestamp_sorting`) sowie CREP-basierte Bewertung
    (`CREP_weight_map`) und Erkennung fraktaler Querverbindungen
    (`fractal_link_mapping`)【15†L15-L23】. Integration: Der ArchivAeon-Agent wird
    typischerweise nach der Fragmentierung eines neuen Gesprächs aufgerufen. Er
    durchläuft alle `*.yaml` Fragmente in einem Konversationsordner, lädt den
    Inhalt und reichert jedes Fragment mit Metadaten an (Cluster-ID, Symbol-Name
    etc.)【15†L35-L43】【15†L45-L53】. Anschließend speichert er ein konsolidiertes
    Archivdokument (z. B. `archivaeon_output.yaml`)【15†L45-L53】 mit den
    angereicherten Fragmenten. Dieses Dokument kann vom System für Analysen oder
    als Trainingsdatensatz genutzt werden. EventBus: nach Abschluss könnte ein
    Event `conversationArchived` gesendet werden. Orchestrator: ruft ArchivAeon
    automatisch für neue Konversationen oder Commits auf. UI: Evtl. ein
    „Archiv“-Bereich, wo man für jede historische Konversation die vom
    ArchivAeon generierten Annotationen sehen kann (Cluster, Symbole). Test &
    Deploy: Unit-Tests können mit künstlichen Fragmenten prüfen, ob das
    Clustering konsistent ist (z. B. alle Fragmente mit ähnlichem Text erhalten
    gleiche Cluster-ID). Integrationstest: Neuer Dummy-Dialog -> Fragmente ->
    ArchivAeon -> prüfe Output-Datei und Event. Vor Deployment sollte
    sichergestellt werden, dass `sklearn` und andere Dependencies verfügbar sind
    (in `requirements.txt` bzw. installiert【15†L23-L31】【15†L33-L41】).
