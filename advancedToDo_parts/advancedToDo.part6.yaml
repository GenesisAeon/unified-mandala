- commit: >-
    {"name":"scripts/extract-training-data.js","type":"code/javascript","content":"#!/usr/bin/env
    node\n/**\n * scripts/extract-training-data.js\n *\n * Extrahiert
    Trainingsdaten aus docs/sigils/newadvancedconversations.json\n * und legt
    sie strukturiert in GenesisAeonZIPMEM/newadvancedconversations ab:\n *  -
    conversation.json & conversation.yaml\n *  - msg_0001.yaml ...\n *  -
    summary.md (Platzhalter)\n *  - meta.yaml\n *  - Updates
    ZIPMEM_manifest.yaml\n *\n * Nutzung: node
    scripts/extract-training-data.js\n */\n\nimport fs from 'fs-extra';\nimport
    path from 'path';\nimport yaml from 'js-yaml';\nimport slugify from
    'slugify';\n\n// Pfade\const SRC =
    path.resolve('docs/sigils/newadvancedconversations.json');\nconst OUT_ROOT =
    path.resolve('GenesisAeonZIPMEM/newadvancedconversations');\nconst MANIFEST
    = path.resolve('GenesisAeonZIPMEM/ZIPMEM_manifest.yaml');\n\nasync function
    extractTrainingData() {\n  // 1. Lade und parse JSON\n  const raw = await
    fs.readFile(SRC, 'utf8');\n  let convos;\n  try {\n    convos =
    JSON.parse(raw);\n    if (!Array.isArray(convos)) throw new Error('Expected
    JSON array');\n  } catch (e) {\n    console.error('Fehler beim Lesen oder
    Parsen der Source JSON:', e);\n    process.exit(1);\n  }\n\n  // 2. Lade
    Manifest\n  let manifest = { conversations: [] };\n  if (await
    fs.pathExists(MANIFEST)) {\n    manifest = yaml.load(await
    fs.readFile(MANIFEST, 'utf8')) || manifest;\n  }\n\n  // 3. Verarbeite jede
    Konversation\n  for (const convo of convos) {\n    // Slug: date + text oder
    id\n    const date = convo.timestamp ? convo.timestamp.slice(0,10) :
    (convo.date || new Date().toISOString().slice(0,10));\n    const title =
    convo.title || convo.id || 'conversation';\n    const slug =
    `${date}-${slugify(title, {lower:true, strict:true})}`;\n    const folder =
    path.join(OUT_ROOT, slug);\n    await fs.ensureDir(folder);\n\n    // 3a.
    Raw JSON & YAML\n    await fs.writeFile(path.join(folder,
    'conversation.json'), JSON.stringify(convo, null, 2));\n    await
    fs.writeFile(path.join(folder, 'conversation.yaml'), yaml.dump(convo, {
    lineWidth: 120 }));\n\n    // 3b. Fragments: msg_XXXX.yaml\n    const
    messages = convo.messages || convo.log || [];\n    for (let i = 0; i <
    messages.length; i++) {\n      const msg = messages[i];\n      const idx =
    String(i+1).padStart(4,'0');\n      const frag = {\n        conversation:
    slug,\n        index: i+1,\n        role: msg.role || msg.sender ||
    'unknown',\n        content: msg.content || msg.text || '',\n        time:
    msg.timestamp || msg.time || null\n      };\n      await
    fs.writeFile(\n        path.join(folder, `msg_\${idx}.yaml`),\n       
    yaml.dump(frag, { lineWidth: 120 })\n      );\n    }\n\n    // 3c. Summary
    placeholder\n    const summaryMd = `# Summary for ${slug}\\n\\n` +\n     
    `*TODO: Generate conversation summary here.*\\n`;\n    await
    fs.writeFile(path.join(folder, 'summary.md'), summaryMd);\n\n    // 3d.
    Meta\n    const meta = {\n      id: slug,\n      title: title,\n      date:
    date,\n      participants: Array.from(new Set(messages.map(m => m.role ||
    m.sender))).filter(Boolean),\n      tags: convo.tags || []\n    };\n   
    await fs.writeFile(path.join(folder, 'meta.yaml'), yaml.dump(meta));\n\n   
    // 3e. Manifest update\n    if (!manifest.conversations.find(c => c.id ===
    slug)) {\n      manifest.conversations.push({\n        id: slug,\n       
    title: title,\n        date: date,\n        summary: '',\n        tags:
    meta.tags\n      });\n    }\n  }\n\n  // 4. Schreibe Manifest zurück\n 
    await fs.ensureDir(path.dirname(MANIFEST));\n  await fs.writeFile(MANIFEST,
    yaml.dump(manifest, { lineWidth: 120 }));\n\n  console.log('✅ Training data
    extraction complete.');\n}\n\nextractTrainingData().catch(err => {\n 
    console.error('Unexpected error:', err);\n  process.exit(1);\n});\n"}
