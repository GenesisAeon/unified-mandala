- commit: >-
    Der *BioSensorGateway* bindet bio-metrische Sensoren oder Simulationen davon
    in das System ein【51†L10-L13】. Ziel ist es, z. B. Puls, Hautleitwert oder
    andere Vitaldaten als zusätzliche Resonanzsignale ins UnifiedMandala
    einzuspeisen. Manifest: Dieses Plugin könnte unter `packages/bio` geführt
    werden und z. B. `autorun: true` mit einem eigenen Service-Thread laufen. Im
    Agenten-Skeleton (`agents/biosensor/main.py`) würde eine Schleife
    implementiert, die (ggf. simuliert) Sensorwerte liest und via EventBus
    Events wie `bioPulse` oder `bioStressLevel` publiziert. Integration: Über
    den EventBus fließen die Bio-Daten ins **CREP-System** ein – beispielsweise
    könnte ein hoher Puls die *Presence*-Metrik beeinflussen. In Phase 2 der
    Resonanzmodule ist explizit die Einbindung des BioSensorGateways in VR-Räume
    vorgesehen【5†L8-L11】, d. h. Avatare im VR-Meeting könnten auf echte
    Biosignale reagieren (z. B. Farbe ändern bei hohem Stress). Der Orchestrator
    startet den BioSensor-Agenten beim Systemstart oder wenn ein Benutzer einen
    Bio-Sensor koppelt. UI: Ein kleines Bio-Panel zeigt die aktuellen Werte
    (Dummy-Werte falls kein echter Sensor). In Tests wurde z. B. bereits ein
    `usePulse` React-Hook implementiert, der Dummy-Pulswerte
    bereitstellt【28†L25-L33】 – dieser sollte mit dem Gateway verbunden werden.
    Test & Deploy: Simulationsmodus testen – z. B. Gateway im Demo-Modus gibt
    sinusförmig variierende Pulswerte aus, UI empfängt sie und zeigt sie an. Bei
    Deployment auf echter Hardware sicherstellen, dass die richtigen
    Treiber/Schnittstellen genutzt werden, und dass die Datenfrequenz begrenzt
    wird (damit EventBus nicht überlastet, evtl. Throttling).
