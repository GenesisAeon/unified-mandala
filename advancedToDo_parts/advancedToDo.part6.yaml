- commit: >-
    Eine fortgeschrittene Technik aus den Gesprächen ist das Konzept eines
    **AI-Friendship-Systems**, das die Interaktion mit dem Nutzer persönlicher
    und langfristig konsistenter gestalten soll. Dieser *FriendshipAgent* würde
    z. B. einen **persistenten Persönlichkeitskern** führen, der sich die
    Vorlieben und der Ton des Nutzers merkt und über längere Zeit eine
    „Freundschaft“ simuliert. Manifest: als optionales Modul eintragbar, das
    vielleicht nur in bestimmten Modi aktiv ist. Agent-Skeleton
    (`agents/friendship/main.py`) mit Methoden `recall_preferences(user)` und
    `personalize_response(input)` etc. Integration: Der Agent fängt
    Benutzer-Eingaben ab (EventBus vor dem allgemeinen Processing) und annotiert
    sie mit Kontext aus der „Freundschaftsdatenbank“ (z. B. der Nutzer mag einen
    freundlichen Umgangston, meidet bestimmte Themen). Die Orchestrator-Logik
    könnte vor der finalen Antwort den FriendshipAgent eine Anpassung vornehmen
    lassen. UI: Möglicherweise ein „Freundschaftslevel“-Anzeige oder die
    Möglichkeit für den Nutzer, Korrekturen an dem gespeicherten Profil
    vorzunehmen. Test & Deploy: Man testet über mehrere Dialogrunden, ob der
    Agent Informationen behält (z. B. der Nutzer sagt einmal „Ich mag Katzen“ –
    später soll der Agent dies wissen und von selbst Katzenreferenzen einbauen).
    Für Deployment ist vor allem der Datenschutz-Aspekt wichtig – die
    gesammelten persönlichen Daten sollten sicher gespeichert und auf Wunsch
    löschbar sein.
  path: ''
