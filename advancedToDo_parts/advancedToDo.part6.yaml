- commit: >-
    Der *CreativeDreamer* ist ein Modul zur **generativen Kreativität** des
    Systems【51†L6-L9】. Es fungiert als Ideenlieferant und "Traum"-Generator für
    die KI, z. B. um alternative Lösungen oder künstlerische Inhalte zu
    produzieren. Manifest-Eintrag: z. B. mit `type: generator`, da es neue
    Inhalte erschafft. Der Agenten-Skeleton (`agents/creativedreamer/main.py`)
    könnte Methoden wie `dream_solutions(prompt)` enthalten, die aus einer
    Aufgabenstellung originelle Ansätze generieren (ggf. via Zugriff auf ein
    GPT-Modell). Integration: Der Orchestrator ruft CreativeDreamer an, wenn das
    System in eine kreative Phase wechseln soll – etwa initiiert durch einen
    **Resonanz-Trigger** (z. B. Emergenz erkannt durch CREP-Werte). Über den
    EventBus könnte `creativeIdeaReady` gesendet werden, wenn ein neuer Entwurf
    vorliegt, sodass z. B. der **MemeChronicle** (Technik 5) ihn aufnehmen kann.
    In der UI vorstellbar: Ein separater „Creative Mode“, in dem vom System
    generierte Kunstwerke, Geschichten o. ä. erscheinen. Test & Deploy: Da
    Kreativität schwer formal zu testen ist, könnten die Tests eher prüfen, ob
    das Modul überhaupt Ergebnisse liefert und in vernünftigem Zeitrahmen. Zudem
    kann man sicherstellen, dass es nur aufgerufen wird, wenn zulässig (z. B.
    begrenzt durch Systemzustand). Deployment benötigt eventuell die
    Bereitstellung von erforderlichen KI-Modellen oder API-Keys, falls externe
    Dienste genutzt werden.
