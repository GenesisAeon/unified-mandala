- commit: >-
    Der **CREPBridge-Agent** verbindet die symbolischen Bewertungen mit
    numerischen Feedback-Schleifen【15†L75-L83】. Diese Technik umfasst die
    Implementierung und Integration aller Tools rund um CREP: Metrik-Berechnung,
    Schwellenüberwachung und automatische Anpassungen. Im Manifest ist
    CREPBridge bereits skizziert mit Methoden `evaluate_crep`,
    `trigger_fractal_refactor`, `log_crep_cycle`【15†L75-L83】【15†L89-L97】. Wir
    stellen sicher, dass dieser Agent fertig implementiert und an den richtigen
    Stellen eingebunden wird. Der Code (`agents/crep_bridge/main.py`) enthält
    z. B. eine Berechnung der Metriken (Coherence, Resonance, Emergence,
    Presence) basierend auf aktuellen Systemdaten – initial vielleicht statisch
    wie im Beispiel (0.85, 0.75, …)【15†L89-L97】, später dynamisch. Integration:
    Der Orchestrator ruft `evaluate_crep()` in regelmäßigen Intervallen oder
    nach bestimmten Aktionen auf. Die Ergebnisse fließen einerseits ins Logging
    (z. B. YAML-Logfiles pro Agent【15†L91-L97】), andererseits in Entscheidungen:
    Wenn Emergence oder ein anderer Wert außerhalb norm liegt, kann
    `trigger_fractal_refactor()` einen Neuaufbau oder Reset
    anstoßen【15†L79-L87】【15†L119-L127】. EventBus: Event `crepUpdated` mit Scores
    könnte verteilt werden, worauf UI (z. B. ein CREP-Dashboard) reagiert,
    ebenso andere Agenten (der **EvolverGPT** könnte bei niedrigem Coherence
    aktiv werden). UI: In der Oberfläche gibt es bereits mehrere Komponenten
    (CREPPlayEngine, CREPTimeline, CREPTestHarness)【18†L93-L99】 – diese
    visualisieren CREP-Werte und sind mit dem CREPBridge-Agenten zu koppeln.
    Test & Deploy: Test, ob der CREP-Agent korrekt reagiert: beispielsweise
    dummy Daten zuführen, bei bestimmten Werten sollte
    `trigger_fractal_refactor` (wenn implementiert) aufgerufen werden. Die Logs
    (`*_crep_log.yaml`) sollten eintrag bekommen. Vor Deployment müssen evtl.
    Parametertweaks erfolgen – z. B. ab welchem Wert Emergence als kritisch gilt
    – und die Abstimmung mit anderen Modulen (z. B. SealCore nutzt CREP in
    core_loop【15†L119-L127】) überprüft werden.
