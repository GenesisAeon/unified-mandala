- commit: >-
    Der *MemeChronicle* dient als **Gedächtnis für Narrative und Memes** im
    System【51†L6-L9】. Er soll wiederkehrende Motive, Insider, Running Gags oder
    wichtige narrative Elemente protokollieren und abrufen können. Im Manifest
    wird er als persistierender Speicher-Modul registriert (mit eigenem
    Datenpfad, z. B. `data/memechronicle.yaml`). Skeleton
    (`agents/memechronicle/main.py`): enthält z. B. eine Funktion
    `record_meme(event)`, die bei bestimmten Events (User reagiert positiv auf
    eine kreativ generierte Idee, o. ä.) das Konzept extrahiert und in einer
    Liste speichert, sowie `get_relevant_memes(context)` um in neuem Kontext
    passende alte Motive vorzuschlagen. Integration: Der EventBus speist den
    MemeChronicle mit relevanten Events (z. B. *Sigil*-Ereignisse, wenn Nutzer
    auf etwas stark reagieren, oder CREP-Spitzen, die auf emergente Ideen
    hindeuten). Der Orchestrator kann den MemeChronicle befragen, bevor eine
    Antwort generiert wird, um ggf. eine passende Anekdote oder Referenz
    einzubauen. UI-seitig könnte es ein „Memoratorium“ geben, wo der Nutzer
    sehen kann, welche wiederkehrenden Symbole/Ideen das System erkannt hat.
    Test & Deploy: Testfälle könnten prüfen, ob hinzugefügte Memes korrekt
    wieder ausgelesen werden (z. B. erst MemeChronicle füttern, dann
    `get_relevant_memes` mit ähnlichem Kontext aufrufen und erwarten, dass es
    die früher gespeicherten liefert). Deployment erfordert dauerhaften Speicher
    (Datei/DB), damit die Memes auch zwischen Sessions erhalten bleiben.
