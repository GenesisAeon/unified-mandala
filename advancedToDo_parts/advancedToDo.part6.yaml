- commit: >-
    Diese Technik ergänzt die CREPPluginAPI und war eine eigenständige
    ToDo-Aufgabe: Die **Plugin-Registry und der dynamische Loader** ermöglichen
    es, Module flexibel zu aktivieren【28†L9-L17】. Inzwischen ist dafür ein
    Grundgerüst vorhanden (siehe `plugins/manifest.yaml` und Hook
    `usePluginLoader`) – als Technik 11 wird die Vollendung und Dokumentation
    dieser Komponente behandelt. Manifest: `plugins/manifest.yaml` listet alle
    verfügbaren Plugins mit Metadaten. Beispiel-Einträge umfassen Plugin-Name,
    Pfad zur Implementierung und optional Abhängigkeiten oder UI-Komponenten.
    Der Loader (z. B. `usePluginLoader.ts` in der UI und
    `services/plugin-loader.ts` im Backend) liest diese Manifest-Datei und lädt
    die Module je nach Konfiguration (z. B. beim Start oder on-demand).
    Integration: Der **GhostShell-Service** stellt über HTTP und Socket IO
    Schnittstellen bereit, um Plugins abzufragen und zu steuern【56†L53-L61】.
    Zudem können Plugins im laufenden Betrieb per EventBus signalisieren, dass
    sie bereit sind oder dass neue hinzukamen. Für die UI gibt es vermutlich
    eine Komponente, die anzeigt, welche Plugins aktiv sind, und evtl.
    ermöglicht, sie zu togglen. Test & Deploy: Unit-Tests prüfen z. B., ob
    `generate-plugin-manifest.ts` korrekt funktioniert (alle Plugin-Ordner
    einsammelt und YAML generiert). Weiterhin, ob `usePluginLoader` die im
    Manifest gelisteten Plugins tatsächlich lädt (hierzu wird in einem Jest-Test
    ggf. ein Dummy-Plugin simuliert). Deployment-Hinweis: Bei Änderungen an
    Plugins sollte `generate-plugin-manifest.ts` erneut laufen, um die
    Manifest-Datei zu aktualisieren – dies kann automatisiert (pre-build Script)
    oder manuell erfolgen.
