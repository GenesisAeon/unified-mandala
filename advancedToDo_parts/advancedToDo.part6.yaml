- commit: >-
    Das *Sigillin-System* ist fundamental in UnifiedMandala – es verbindet
    symbolische Marker (**Sigils**) mit Prozessen. Diese Technik stellt sicher,
    dass Sigils in den Entwicklungs- und Selbstoptimierungs-Workflow integriert
    sind. Dazu zählen: **ToDo-Sigils**, die Aufgabenfortschritt markieren,
    **Transition Sigils**, die Phasenübergänge kennzeichnen, und **CoreSymbols**
    für grundlegende Systemkonzepte【8†L13-L22】. Manifest: In `sigilMemory/`
    liegen z. B. `transitionSigils/`, `coreSymbols/` etc., sowie ein Manifest
    oder Index, welche Sigils aktuell aktiv sind【8†L13-L21】. Umsetzung: Ein
    *SigilManager-Agent* (oder Erweiterung eines bestehenden Agents) verwaltet
    diese Sigil-Dateien. Beispielsweise generiert ein **SigilGenerator** aus
    Aufgabenlisten entsprechende Symbol-Dateien【33†L19-L27】, und ein
    **SigilUpdater** aktualisiert deren Status【33†L23-L27】. Integration: Der
    EventBus könnte jedes Mal, wenn eine Aufgabe abgeschlossen wird oder ein
    Meilenstein erreicht ist, den SigilManager anstoßen, ein neues Sigil zu
    vergeben (z. B. eine Auszeichnung). Diese Sigils werden im UI vielleicht als
    Abzeichen oder Achievements angezeigt. Im Code gibt es Anzeichen dafür, dass
    ToDo-Listen in Sigils überführt werden (Stichwort
    `ToDo-Sigillin-Dateien`【33†L19-L27】). Auch das Chronopoem (poetische
    Zusammenfassung des CREP-Zustands) reflektiert
    Sigils【46†L13-L18】【46†L25-L31】. Test & Deploy: Hier testet man z. B., ob
    beim Abschluss einer Aufgabe (z. B. Markierung "done" in advancedToDo) der
    entsprechende Sigil-Eintrag gesetzt wird. Auch ob Sigils korrekt geladen und
    angezeigt werden. Für Deployment müssen ggf. vorhandene Sigil-Dateien in
    `GenesisAeonZIPMEM` übernommen und neue Sigils definiert werden (z. B. in
    `SIGILLIN_GENESIS.md` sind Grundlagen beschrieben).
  path: ''
