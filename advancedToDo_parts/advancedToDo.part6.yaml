    Skripte ausführen, um die Datenbasis zu aktualisieren. Tatsächlich wird
    z. B. beim Entwicklungsworkflow vor jedem Commit
    `scripts/update-code-todos.js` und `scripts/sync-todo-progress.js`
    ausgeführt【54†L1-L4】, was sicherstellt, dass neu erkannte ToDos aus
    Konversationen synchronisiert werden. Ein Hintergrunddienst namens
    **GhostShell** überwacht zudem kontinuierlich die Speicherfragmente: Mittels
    eines Watchers (via `chokidar`) reagiert er auf Änderungen in
    `GenesisAeonZIPMEM/newadvancedconversations/**/*.yaml`【56†L125-L133】. Dieser
    GhostShell-Agent plant adaptiv einen Selbstlernprozess ein – über
    `scheduleAdaptive` wird regelmäßig die Anzahl der Fragmentdateien geprüft
    und dann `runSelfLearn` aufgerufen【56†L134-L139】. So fließen neue
    Dialogfragmente in eine Selbstverbesserungsschleife ein, in der z. B.
    **implizite ToDos** aus den Gesprächen extrahiert und priorisiert werden.
    Ein Analysemodul durchsucht die Gespräche nach Schlüsselbegriffen wie „TODO“
    oder impliziten Aufgaben und generiert daraus eine ToDo-Liste (siehe
    `extractImplicitTodosFromConversations` und Ausgabe
    `implicit-todos.yaml`【16†L8-L12】). Diese automatischen ToDo-Einträge (mit
    Feldern wie *commit*, *path*, *task*, *test*) werden vom System
    weiterverarbeitet – etwa um sie ins Manifest aufzunehmen oder als Aufgaben
    an Entwicklungs-Agenten weiterzugeben.
