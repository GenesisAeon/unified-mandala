- commit: >-
    Der *EthicGuardian* überwacht Antworten und Systementscheidungen auf
    ethische Konformität【51†L4-L8】. Im Manifest wird dieses Modul als
    Sicherheits-Plugin registriert (z. B. `autorun: true`, damit es ständig
    aktiv ist). Der Agent (`agents/ethics/main.py`) beinhaltet einen Skeleton
    mit Methoden wie `check_ethics(content)` und nutzt eventuell vordefinierte
    Regeln oder KI-Modelle, um etwaige Verstöße (z. B. beleidigende Sprache,
    Voreingenommenheit) zu erkennen. Integration: Über den EventBus könnte jedes
    mal, wenn der KI-Assistent eine Antwort generiert, ein Event
    `contentGenerated` gesendet werden, worauf der EthicGuardian reagiert. Bei
    einem Verstoß kann er entweder direkt eine **BoundaryRuleViolation**
    auslösen oder über den Orchestrator eine Korrektur anstoßen (z. B. den
    **EvolverGPT** bitten, eine ethischere Alternative zu formulieren). In der
    UI könnte der EthicGuardian als „Ethik-Filter“ erscheinen, der fragwürdige
    Ausgaben markiert. Test & Deploy: Simulierte problematische Ausgaben (z. B.
    Schimpfworte) werden dem Agenten zugeführt, der sollte erkennen und
    markieren (erwartetes Ergebnis: Flag oder Abbruch). Vor Deployment sind
    entsprechende **Heuristiken und Schwellenwerte** zu setzen, die im Manifest
    oder in einer Konfig (z. B. `agents/ethics/config.yaml`) gepflegt werden.
  path: ''
