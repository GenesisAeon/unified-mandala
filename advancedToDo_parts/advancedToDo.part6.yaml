    Empfang auf der Peer-Instanz\n3. **UI-E2E**: Verknüpfe Mandalas über Modal,
    beobachte Heatmap-Update auf Map\n\n---\n\n## 9. Governance & Sicherheit\n-
    **Auth**: JWT-Token-Validierung für `/federate`-Requests\n- **Encryption**:
    NATS-TLS für sichere Event-Übertragung\n- **Review**: Peer-Review-Flow vor
    Hinzufügen einer neuen Instanz im Federation-Modal\n\n---\n\n## 10. Next
