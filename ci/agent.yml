name: Agent
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      - name: Run schema validation
        run: ./scripts/validate-schemas.sh
      - name: Run Go tests
        run: |
          go test ./services/vector-indexer
