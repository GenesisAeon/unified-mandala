name: Agent
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      - name: Run schema validation
        run: ./scripts/validate-schemas.sh
      - name: Run Go tests
        run: |
          go test ./services/vector-indexer
      - name: Package Lambda@Edge
        run: ./scripts/package-lambda-edge.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - run: pnpm install --frozen-lockfile
      - name: Build dist artifacts
        run: pnpm run build
      - name: Build ML plugins manifest
        run: node scripts/run-dist.mjs scripts/generate-plugin-manifest
      - name: Run policy suite
        run: pnpm run policy:check
      - name: Lint AI policy
        run: node scripts/check-ai-policy.js
