version: '3.8'
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./otel-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4318:4318'
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'
