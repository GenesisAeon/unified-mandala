openapi: 3.0.0
info:
  title: Nukleon Scanner API
  version: 1.0.0
paths:
  /nukleon/scan:
    post:
      summary: Scan text and return CREP signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema:
                type: object
                properties:
                  coherence:
                    type: number
                  resonance:
                    type: number
                  emergence:
                    type: number
                  poetics:
                    type: number

