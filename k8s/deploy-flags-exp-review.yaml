apiVersion: apps/v1
kind: Deployment
metadata:
  name: flags-api
  labels:
    app: flags-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flags-api
  template:
    metadata:
      labels:
        app: flags-api
    spec:
      containers:
        - name: flags-api
          image: ghcr.io/unified-mandala/flags-api:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: flags-api
  labels:
    app: flags-api
spec:
  selector:
    app: flags-api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
