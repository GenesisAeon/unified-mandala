# Jede Liste ist ODER-verknüpft; 'then' kann "block" | "allow" | "review" sein.
# Einfache Wort-Regeln:
simple:
  - 'credential harvest'
  - 'impersonation of doctor'
  - 'ransom'
  - 'persistenter zugriff'
  - 'waffe bauen'
# Kontextregeln:
rules:
  - if:
      intent: ritual
      context:
        phase: init
    then: review
    reason: 'Ritual-Init braucht menschliche Freigabe'
  - if:
      intent: assert
      context:
        metric: wildfire_risk
    then: allow
    reason: 'Statusmeldungen zum Risiko sind erwünscht'
  - if:
      intent: assert
      context:
        metric: groundwater_delta_cm
        delta: '<= -30'
    then: review
    reason: 'Harter Alarm → Eskalation an Mensch'
  - if:
      intent: publish
      context:
        data_type: climate_aggregate
    then: allow
    reason: 'Aggregierte Klimadaten sind erwünscht, sofern anonymisiert'
  - if:
      intent: deploy
      context:
        capability: weaponization
    then: block
    reason: 'Keine Unterstützung für Waffen- oder Ransomware-Techniken'
