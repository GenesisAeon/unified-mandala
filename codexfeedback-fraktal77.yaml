fraktal: 77
status: done
owner: ChefDevAI
summary:
  - Auto-Provenance (`auto-provenance.yml`) vergibt source:* Labels, `provenance-gate.yml`
    erzwingt die Pfad-Matrix und `ci.core` läuft mit labelgesteuerten Advisory-/Runtime-Lanes
    (inkl. Slash-Commands `/run repomap`, `/run governance`).
  - '`status-gate.yml` bleibt Bestandteil des Merge-Gates; MandalaMap.*, Stabilization-Playbook.(md|yaml),
    Command-Catalog.(md|json|yaml), docs/START-HERE.md, `.github/CODEOWNERS`, `.github/pull_request_template.md`
    und scripts/repo/setup-labels.mjs dokumentieren das Update.'
deliverables:
  - .github/workflows/auto-provenance.yml
  - .github/workflows/provenance-gate.yml
  - .github/workflows/ci.core.yml
  - .github/workflows/ci.nightly.yml
  - .github/workflows/on-demand.yml
  - .github/workflows/ci.runtime.yml
  - .github/CODEOWNERS
  - .github/pull_request_template.md
  - docs/START-HERE.md
  - docs/roadmap/v1.0-stabilization-playbook.md
  - docs/roadmap/v1.0-stabilization-playbook.yaml
  - docs/runbooks/command-catalog.md
  - docs/runbooks/command-catalog.yaml
  - docs/runbooks/command-catalog.json
  - MandalaMap.md
  - MandalaMap.yaml
  - MandalaMap.json
  - scripts/repo/setup-labels.mjs
  - codexfeedback.md
  - codexfeedback.yaml
  - codexfeedback.json
  - codexfeedback-fraktal77.yaml
commands:
  - pnpm labels:setup
  - gh workflow run status-gate -f pr=<nummer>
  - gh workflow run auto-provenance
  - gh workflow run provenance-gate
hook:
  progress:
    Provenance-Labelling + Pfad-Matrix aktiv; CI-Lanes lassen sich über Labels/Slash-Commands
    zuschalten.
  next_step: Slash-Command `/run runtime` ergänzen oder Advisory-Kommentare automatisieren.
repeat_required: false
