fraktal: 77
status: done
owner: ChefDevAI
summary:
  - Workflow `status-gate.yml` prüft Ready-to-merge Labels (Draft, ReviewDecision, Mergeability,
    Status-Rollup) und aktiviert Auto-/Merge-Queue ausschließlich bei SUCCESS.
  - '`auto-provenance.yml` vergibt automatisch `source:*` Labels, `provenance-gate.yml`
    schützt packages/**/core sowie Guard-/Deploy-Pfade, `ci.runtime.yml` läuft nur via
    Label `ci:runtime`, `on-demand.yml` liefert Slash-Commands (`/run repomap`, `/run
    governance`).'
  - '`docs/START-HERE.md` erklärt Golden Path, Two-Plane & Provenance-Matrix; `scripts/repo/setup-labels.mjs`
    + `pnpm labels:setup` bootstrappen die erforderlichen GitHub-Labels. MandalaMap.*,
    Stabilization-Playbook.(md|yaml), Command-Catalog.(md|json|yaml) und codexfeedback*
    spiegeln den erweiterten Guard.'
deliverables:
  - .github/CODEOWNERS
  - .github/workflows/auto-provenance.yml
  - .github/workflows/ci.runtime.yml
  - .github/workflows/on-demand.yml
  - .github/workflows/provenance-gate.yml
  - .github/workflows/status-gate.yml
  - MandalaMap.json
  - MandalaMap.md
  - MandalaMap.yaml
  - analysis/devtalk77-evaluation.md
  - analysis/scripts-and-commands.json
  - codexfeedback-fraktal77.yaml
  - codexfeedback.json
  - codexfeedback.md
  - codexfeedback.yaml
  - docs/START-HERE.md
  - docs/cheatsheets/unified-mandala-workflows.md
  - docs/roadmap/v1.0-stabilization-playbook.md
  - docs/roadmap/v1.0-stabilization-playbook.yaml
  - docs/runbooks/command-catalog.json
  - docs/runbooks/command-catalog.md
  - docs/runbooks/command-catalog.yaml
  - package.json
  - scripts/repo/setup-labels.mjs
commands:
  - gh workflow run status-gate -f pr=<nummer>
  - pnpm labels:setup
hook:
  progress: Status-/Provenance-Gates aktiv; Ready-to-merge + source:* Labels sind
    automatisiert, Runtime-Läufe nur via Label `ci:runtime`.
  next_step:
    Optional CI-Danger-Annotationen für Provenance-Fehler ergänzen oder Runtime-Smoke-Coverage
    erweitern.
repeat_required: false
