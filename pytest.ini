[pytest]
markers =
    slow: mark tests that exercise full data pipelines or take noticeable time and should only run in extended suites.
    experimental: mark tests for features that are not yet production ready; skipped in core and extended runs.
    integration: mark tests that require external services or multiple components working together.
    unit: mark pure unit tests with no external dependencies.
    e2e: mark end-to-end tests that exercise the full stack.
    governance: mark tests related to policy and governance enforcement.
    contract: mark contract/schema compliance tests.
    thermodynamics: mark tests for thermodynamic and entropy calculations.
    planetary: mark tests for planetary coupling and orbital mechanics.
    metaquest: mark tests for metaquest and sigil-related features.
    collapse: mark tests for collapse detection and resilience scenarios.
testpaths = tests
pythonpath = src
