apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mandala-governance
spec:
  validationFailureAction: audit
  rules:
    - name: require-personhood-level
      match:
        any:
          - resources:
              kinds: ['MandalaEvent']
      validate:
        message: 'High-risk topics require personhood P3'
        pattern:
          (topic): 'governance.override'
          (personhood): 'P3'
    - name: enforce-empty-keys
      match:
        any:
          - resources:
              kinds: ['MandalaEvent']
      validate:
        message: 'keys/ directory must remain automation-only (.gitignore/.gitkeep).'
        pattern:
          repo:
            keys:
              unexpected: []
