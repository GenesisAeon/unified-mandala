summary:
  - 'NetCDF adapters call `open_dataset` with deterministic engine fallbacks (netcdf4→h5netcdf) and raise clearer errors when all attempts fail; STAC helpers emit POSIX/relative hrefs so validation succeeds across Windows and Linux.'
  - 'Adapter build scripts normalise Python arguments and manifest paths to POSIX form, preventing `data\processed` href regressions on Windows.'
  - 'QA runner lazily resolves `PantheonPortalAnalytics` with dist/src fallbacks and async guard handling so pnpm qa works both pre- and post-build.'
  - 'Vitest coverage split: `pnpm test:unit` is now a fast run, `pnpm test:unit:coverage` feeds CI; workflows and docs (README, onboarding, command catalog, MandalaMap, stabilization playbook) reference the new command.'
