version: '3.8'

x-node-dev: &node_dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/workspace/unified-mandala

services:
  ui:
    <<: *node_dev
    command: pnpm dev:services
    ports:
      - '3000:3000'
    profiles:
      - core
      - default

  test:
    <<: *node_dev
    command: ./scripts/run-all-tests.sh
    profiles:
      - ci

  # --- NewsBot microservices ---
  newsbot_orchestrator:
    <<: *node_dev
    command: python orchestrator/newsbot_orchestrator.py
    depends_on:
      - news_fetcher_service
      - script_gen_service
      - tts_service
      - avatar_renderer_service
      - streamer_service
      - finetune_service
      - review_service
    ports:
      - '8100:8000'
    profiles:
      - newsbot

  news_fetcher_service:
    build:
      context: ./services/newsbot/news_fetcher
    ports:
      - '8101:8000'
    profiles:
      - newsbot

  script_gen_service:
    build:
      context: ./services/newsbot/script_gen
    ports:
      - '8102:8000'
    profiles:
      - newsbot

  tts_service:
    build:
      context: ./services/newsbot/tts
    ports:
      - '8103:8000'
    profiles:
      - newsbot

  avatar_renderer_service:
    build:
      context: ./services/newsbot/avatar_renderer
    ports:
      - '8104:8000'
    profiles:
      - newsbot

  streamer_service:
    build:
      context: ./services/newsbot/streamer
    ports:
      - '8105:8000'
    profiles:
      - newsbot

  finetune_service:
    build:
      context: ./services/finetune
    ports:
      - '8106:8000'
    profiles:
      - newsbot

  review_service:
    build:
      context: ./agents/review_checkpoint
    ports:
      - '8107:8000'
    profiles:
      - newsbot

  singularity_simulator_service:
    build:
      context: ./agents/singularity_simulator
    ports:
      - '8108:8000'
    profiles:
      - newsbot

  # --- Open-source chat services ---
  gpt4all_service:
    image: ghcr.io/nomic-ai/gpt4all:latest
    ports:
      - '8201:80'
    profiles:
      - llm

  openassistant_service:
    image: ghcr.io/laion-ai/open-assistant:latest
    ports:
      - '8202:80'
    profiles:
      - llm

  h2ogpt_service:
    image: ghcr.io/h2oai/h2ogpt-server:latest
    ports:
      - '8203:80'
    profiles:
      - llm

  text_generation_webui_service:
    image: ghcr.io/oobabooga/text-generation-webui:latest
    ports:
      - '8204:7860'
    profiles:
      - llm

  autogen_service:
    image: ghcr.io/microsoft/autogen:latest
    ports:
      - '8205:80'
    profiles:
      - llm

  # --- Climate news microservices ---
  climate_news_orchestrator:
    <<: *node_dev
    command: python agents/news_climate/orchestrator.py
    depends_on:
      - climate_service
      - forest_service
      - flood_service
      - economy_service
      - emissions_service
      - mitigation_service
    ports:
      - '8300:8000'
    profiles:
      - climate

  climate_service:
    <<: *node_dev
    command: python agents/news_climate/climate_service.py
    ports:
      - '8301:8000'
    profiles:
      - climate

  forest_service:
    <<: *node_dev
    command: python agents/news_climate/forest_service.py
    ports:
      - '8302:8000'
    profiles:
      - climate

  flood_service:
    <<: *node_dev
    command: python agents/news_climate/flood_service.py
    ports:
      - '8303:8000'
    profiles:
      - climate

  economy_service:
    <<: *node_dev
    command: python agents/news_climate/economy_service.py
    ports:
      - '8304:8000'
    profiles:
      - climate

  emissions_service:
    <<: *node_dev
    command: python agents/news_climate/emissions_service.py
    ports:
      - '8305:8000'
    profiles:
      - climate

  mitigation_service:
    <<: *node_dev
    command: python agents/news_climate/mitigation_service.py
    ports:
      - '8306:8000'
    profiles:
      - climate

  # --- Global events microservices ---
  global_events_orchestrator:
    <<: *node_dev
    command: python agents/global_events/orchestrator.py
    depends_on:
      - science_service
      - tech_service
      - environment_service
    ports:
      - '8400:8000'
    profiles:
      - global

  science_service:
    <<: *node_dev
    command: python agents/global_events/science_service.py
    ports:
      - '8401:8000'
    profiles:
      - global

  tech_service:
    <<: *node_dev
    command: python agents/global_events/tech_service.py
    ports:
      - '8402:8000'
    profiles:
      - global

  environment_service:
    <<: *node_dev
    command: python agents/global_events/environment_service.py
    ports:
      - '8403:8000'
    profiles:
      - global

  digital_twin_agent:
    build:
      context: ./agents/digital_twin
    ports:
      - '8404:8000'
    profiles:
      - agents

  gamification_agent:
    build:
      context: ./agents/gamification
    ports:
      - '8405:8000'
    profiles:
      - agents

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - monitoring
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:latest
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - '3300:3000'
