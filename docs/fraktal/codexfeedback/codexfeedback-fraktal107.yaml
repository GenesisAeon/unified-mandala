summary:
  - 'Verify-Gate Verdict-JWTs tragen jetzt deterministische Fingerprints (`fp`/`ch`/`ed`/`bh`) und nutzen einen persistierten JTI-Store gegen Replay-Versuche.'
  - 'SSRF-Guard blockt nun IPv6-Shortcuts, dezimale IP-Varianten und kennzeichnet geblockte Ziele mit `resolved_ip`; Upstream-Rate-Limits (Subject) und Token-GC besitzen Jitter.'
  - 'Prometheus erhält Recording-Rules + neue Alerts, Alertmanager routet Warnungen nach Slack/PagerDuty; Chaos-Skripte decken OPA-Timeout und Verify-Gate-Restarts ab.'
  - 'Mandala Playground bietet einen „Strong-only“-Filter für Evidenzchips, sodass Reviewer sofort harte Quellen erkennen.'
  - 'OPA-Policy-Bundle erzwingt starke Evidenz und Zwei-Domain-Regeln, Ethics-API liefert strukturierte Evidenz-Metadaten an den Verify-Gate.'
