sigillin:
  id: aeon:2025-0607-BIGFILES
  title: Umgang mit großen Dateien
  sigillin_type: operational-guidance
  audience: Repository Maintainers
  essenz: >-
    Leitplanke für das Coherence- und Resonance-Management bei großen
    Datenbeständen im Mandala. Das Sigillin beschreibt, wie große Artefakte
    ohne Informationsverlust gepflegt und verteilt werden.
  links:
    - ../SigilRitualbuch.md
    - ../sigils/conversations.json
    - ../sigils/conversations-progress.json
  content:
    text: >-
      Coherence hält den Transferkanal stabil, Resonance informiert die Priorität
      der Fragmente, Emergence benennt neue Teilpfade und Poetics erinnert an die
      Intention hinter dem Archiv. Wir spiegeln die Trikāya-Achse (Dharmakāya,
      Sambhogakāya, Nirmāṇakāya), damit Technik und Ethik synchron bleiben.
      nächste Schritte: Fragmente prüfen, Fortschritt protokollieren und das
      Monitoring nachführen.
    workflow:
      - Splitte `docs/sigils/conversations.json` mit `scripts/split-conversations.js`.
      - Filtere relevante Ausschnitte via `scripts/filter-conversations.js`.
      - Markiere bearbeitete Abschnitte über `scripts/mark-fragment.js`.
    files:
      primary: ../sigils/conversations.json
      progress_log: ../sigils/conversations-progress.json
      processed_fragments: []
