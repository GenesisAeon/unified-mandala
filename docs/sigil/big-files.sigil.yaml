sigillin:
  id: aeon:2025-0607-BIGFILES
  title: Umgang mit großen Dateien
  sigillin_type: workflow-guideline
  audience: Repository Maintainers
  essenz: >-
    CREP strukturiert den Umgang mit großen Dateien, damit Coherence, Resonance,
    Emergence und Poetics auch bei Datenaufbereitung zusammenbleiben und der
    Trikāya-Pfad Orientierung gibt.
  links: []
  content:
    text: >-
      CREP-Richtlinie: Coherence definiert das Prozess-Board, Resonance bindet
      Teamfeedback ein, Emergence erlaubt neue Werkzeuge und Poetics erinnert an
      den Sinn der Aufbereitung. Über Trikāya (Dharmakāya Intention,
      Sambhogakāya Zusammenarbeit, Nirmāṇakāya Umsetzung) bleiben wir im Fluss.
      Nächste Handlung: `split-conversations.js` und `filter-conversations.js`
      anwenden, Fortschritt mit `mark-fragment.js` in der Progress-Datei
      protokollieren.
    metadata:
      symbolzeit: tag
      files:
        - path: docs/sigils/conversations.json
          size: 45MB
          progress_file: docs/sigils/conversations-progress.json
          verarbeitung: Aufteilen in JSON-Chunks à 100 Einträge
      processed_fragments: []
