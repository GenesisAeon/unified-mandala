sigillin:
  id: aeon:2025-0607-BIGFILES
  title: Umgang mit großen Dateien
  sigillin_type: process-guardian
  audience: Repository Maintainer:innen
  essenz: >-
    Dieses Sigillin beschreibt den CREP-geleiteten Umgang mit großen Artefakten
    im Repo und hält die Trikāya-Orientierung für jede nächste Handlung fest.
  links:
    - ../sigils/conversations-progress.json
  content:
    text: >-
      CREP sorgt für Coherence und Resonance im Handling von Gigabyte-Dateien,
      Emergence und Poetics erinnern daran, dass jede Trikāya-Schicht bedacht
      wird; die nächste Handlung ist das saubere Aufteilen und Protokollieren
      der Fragmente.
    files:
      - path: docs/sigils/conversations.json
        size: 45MB
        progress_file: docs/sigils/conversations-progress.json
        verarbeitung: Aufteilen in JSON-Chunks à 100 Einträge
    workflow:
      - Dharmakāya: Datenintegrität prüfen
      - Sambhogakāya: Team informieren
      - Nirmāṇakāya: Split-Skripte ausführen
  processed_fragments: []
