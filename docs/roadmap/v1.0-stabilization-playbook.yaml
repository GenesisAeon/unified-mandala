          \ und nutzt `$JS.API.INFO` als Fallback. Lokale Workflows verwenden `pnpm nats:docker`\
          \ f\xFCr JetStream-Container, `pnpm dev:stack` pr\xFCft Ports und r\xE4umt sie\
          \ standardm\xE4\xDFig via kill-port auf (Opt-out: `UM_DEV_SERVICES_AUTOFREE_PORTS=0`)\
          \ und verweist bei Bedarf auf `pnpm dev:ports:free`. Runbook `docs/runbooks/nats-jetstream.md`\
          \ dokumentiert Setup und Troubleshooting, README & Tests-Runbook spiegeln die\
          \ neuen Hinweise.\nFraktal61: CI-Core f\xFChrt zus\xE4tzlich `pnpm test:unit:coverage`\
          \ mit Coverage aus und ver\xF6ffentlicht den Report als Artefakt (`coverage-vitest`).\n\
          Fraktal64+: Core-, Extended- und Nightly-Jobs installieren `src/adapters/requirements.txt`,\
          \ sodass NetCDF4/h5netcdf/scipy offline verf\xFCgbar sind; `PANTHEON_DISABLE=1`\
          \ deaktiviert Pantheon-Analytics in QA-L\xE4ufen, Coverage-Jobs nutzen `pnpm\
          \ test:unit:coverage` konsistent und Pytests sichern die STAC-HREF-Normalisierung\
          \ gegen Item-Verzeichnisse ab. Fraktal65: CI-Core setzt auf die Skript-Aliase\
          \ `pnpm typecheck`, `pnpm test:unit` und `pnpm test:unit:coverage`, Governance-Workflows\
          \ laufen mit `pnpm schema:validate`, `pnpm maps:validate`, `pnpm policy:check`,\
          \ und Repo-Sanity pr\xFCft `ciBehaviour`-Felder via `pnpm sanity`.\nFraktal73:\
          \ Windows-Setup (`scripts/setup-dev-env.ps1`) erkennt Docker-basierte `nats`-Container,\
          \ exportiert Status / Start-Hinweise im InstallReport und Runbooks/README dokumentieren\
          \ `docker ps -a ...`, `docker start nats`, `docker logs --tail=50 nats` sowie\
          \ den PowerShell-Portcheck `Test-NetConnection 127.0.0.1 -Port 4222`.\nFraktal78:\
          \ `ci.core.yml` b\xFCndelt `pnpm test:unit:coverage`, `pnpm schema:validate`,\
          \ `pnpm maps:validate`, `pnpm sanity` und `pnpm policy:check` als Pflicht-Gates;\
          \ das Artefakt `coverage-vitest` wird hochgeladen und die Advisory-Lane (`ci:advisory`)\
          \ ruft `pnpm check:ci` als Soft-Fail-Bundle auf. Fraktal79: `pnpm start:cosmic-web`\
          \ orchestriert NATS, Demo-Artefakte, Dev-Services, Vite und den Cosmic-Ticker\
          \ in einem Kommando, triggert `pnpm smoke:ui` mit dynamischem Port; mandala-ui\
          \ liefert `/demo/ai-playground` via Vite-Proxy (Port 4000 \u2192 `apps/api`)\
          \ und `scripts/ci/no-local-path-leaks.mjs` blockt Windows-Pfade/Secrets im Staging-Bereich.\
          \ Fraktal86: `scripts/dev-helper.ps1` setzt Service-Ports (share, experiments,\
          \ rag, flags, api, health, realtime) als absolute Werte je Offset; `config/ports.ts`\
          \ und `apps/ui/vite.config.ts` interpretieren Umgebungsvariablen als finale\
          \ Ports und `scripts/dev-services.mjs` vermeidet doppelte Offset-Aufschl\xE4\
          ge bei der Portpr\xFCfung.\nFraktal105: Vitest aliasiert `@opentelemetry/api`\
          \ auf Stub (`tests/__mocks__/otel-api.ts`), `tests/setup/ci.ts` setzt Loopback-Allowlists\
          \ (`VERIFY_GATE_SSRF_ALLOWLIST=http://127.0.0.1:*,http://localhost:*`), SSRF-Gate\
          \ akzeptiert Protokoll-/Port-Wildcards und `verifyEthics` nutzt `clockTolerance:\
          \ 5`; `analysis/devtalk105-evaluation.md` h\xE4lt Prometheus-/OPA-Hooks fest.\n"
        success:
