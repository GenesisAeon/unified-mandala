. Update 2025-12-12 (Fraktal103 Defense-in-Depth) härtet Verify-Gate mit Header-Drop-Liste, DNS-basierter SSRF-Allowlist (`VERIFY_GATE_UPSTREAM_ALLOWLIST`), Standard-JSON-Headern, Prometheus (`verify_gate_inflight`, `verify_gate_upstream_duration_ms`, `verify_gate_http_responses_total`) samt `/metrics` und Vitest-Coverage für Streaming/SSRF. `apps/ethics-api` signalisiert degradierte Pfade via `x-ethics-degraded`, zählt `ethics_degraded_total`, cached Boundary-Ergebnisse (`ETHICS_CACHE_TTL_MS`) per SHA1, führt Lifeboat-Regeln (Hate/PII/Scam) und erzwingt eindeutige Evidenz-Domains (`ETHICS_REQUIRE_UNIQUE_EVIDENCE_DOMAINS`); neue Counter (`ethics_decision_log_total`, `ethics_evidence_domains_total`) und Trace-Kontext (`traceparent`/`tracestate`) werden propagiert. Decision-Logs speichern nur Payload-Hashes. Fraktal104 (2025-12-13) verankert den Idempotency-Puffer (`VERIFY_GATE_IDEMP_TTL_MS`, 409 bei Duplikaten) samt JWT-signierten Ethics-Verdict-Tokens (`VERIFY_GATE_JWT_SECRET`), pinned Upstream-IPs (`makePinnedAgent`) und `/readyz`-Checks auf Allowlist + erreichbares Ethics. `apps/api` erzwingt `x-ethics-token` via Middleware `verifyEthics` (428 bei Fehlmatch). `apps/ethics-api` nutzt tldts für PSL-Domains, markiert starke Evidenz (DOI/arXiv/Gov), erweitert Lifeboat-Regeln (Payment-Scam, Malware-Download, Impersonation), sampelt Logs (`LOG_SAMPLE_GREEN`), liefert `boundary_cache_warm` im `/readyz` und bindet optional OPA (`ETHICS_OPA_*`) fail-closed ein. Chaos-Skript `pnpm chaos:ethics` begleitet Fail-Closed-Proben; neue Tests (`idempotency.test.ts`, `ethics-token-guard.test.ts`) sichern Duplikate & Token-Flow. Update 2025-12-14 (Fraktal106 Observability & Rotation): Verify-Gate persistiert Idempotency-Keys via `better-sqlite3` (`apps/verify-gate/src/idempotency/store.ts`, `VERIFY_GATE_IDEMP_DB`, `VERIFY_GATE_IDEMP_TTL_MS`) und blockt Replays nach Neustart (`persist-replay` in `idempotency.test.ts`). Prometheus-Metriken bleiben in `metrics.ts` (`verify_gate_idem_hits_total`, `verify_gate_ssrf_block_total{host}`, `verify_gate_token_fail_total{reason}`, Histogram `verify_gate_upstream_duration_ms{method,route,code}`) und Header-Forwarding nutzt eine Safelist (`authorization`, `cookie`, `user-agent`, `accept`, `accept-language`, `content-type`, `x-request-id`, `x-forwarded-for`, `x-forwarded-proto`, `x-ethics-token`). Verdict-Tokens rotieren via `VERIFY_GATE_JWT_SECRETS`/`VERIFY_GATE_JWT_ACTIVE_KID`; `ethics-token-guard.test.ts` prüft Legacy/Rotation/Drop und `docs/runbooks/verify-gate-jwt-rotation.md` dokumentiert den Ablauf. `apps/ethics-api/opa/policy.rego` verlangt starke Evidenz für Fakten und verweigert bei `input.degraded == true`. `X-Verify-Degraded` propagiert bis zur UI (`apps/api`, `MandalaAIPlayground` zeigt Fail-closed-Banner, `fetchJsonWithEthics` liefert Degraded-Meta). Chaos-Skript `pnpm chaos:ethics --scenario boundary-down` bleibt Nightly-Gate; MandalaMap.*, codexfeedback-latest.*, analysis/devtalk106-evaluation.md spiegeln die neuen Knobs (`VERIFY_GATE_IDEMP_DB`, `X-Verify-Degraded`).  Update 2025-12-21 (Fraktal108 SSRF AAAA Guard): Verify-Gate resolvt nun A- und AAAA-Records via `dns.lookup(..., { all: true, verbatim: true })`, fällt bei DNS-Fehlern fail-closed (kein `[host]`-Fallback), blockiert ::1 und weitere private Ziele deterministisch und zählt Probleme über `verify_gate_ssrf_resolve_error_total` bzw. leere Antworten über `verify_gate_ssrf_resolve_empty_total`; `makePinnedAgent` übernimmt die aufgelöste IP für das Upstream-Binding. Follow-up 2025-12-22 (Fraktal108 Hardening Pack in Planung): Hardening Pack priorisiert TTL-bewusste DNS-Pins (Resolver-Cache, Keep-Alive ≤ `minTTL`), CNAME-/IDNA-Validierung mit Telemetrie (`verify_gate_ssrf_cname_hops_total`), TLS-SAN/IP-Vergleich & `remoteAddress`-Checks (`verify_gate_tls_name_mismatch_total`), Redirect-Gates (≤3 Hops, http/https, Allowlist je Hop) sowie IPv6-/NAT64-Blocklisten. Neue Counter `verify_gate_dns_ttl_pinned_seconds_bucket`, `verify_gate_redirect_block_total`, `verify_gate_ip_mismatch_total` und zusätzliche OPA-Inputs (`resolved_ip`, `cname_chain`, `min_ttl_sec`) sind geplant; Vitest-Tabelle + TTL-Rebind-Chaosdrill & Grafana/Alert-Updates folgen (siehe `analysis/devtalk109-evaluation.md`, MandalaMap.*, codexfeedback*). Fraktal106 Observability Follow-up (2025-12-15) ergänzt ein minimales Grafana-Dashboard (`grafana/dashboards/verify-gate-ethics-mini.json`) sowie Prometheus-Alerts (`observability/alerts/verify-gate.yaml`) für Replay-, SSRF- und Token-Fail-Spitzen; Docs/MandalaMap/codexfeedback verweisen auf das Bundle.'
