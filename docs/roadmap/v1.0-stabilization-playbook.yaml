fraktal: 40
release: v1.0
owner: codex
updated: '2025-11-08'
summary: 'Strukturierter Maßnahmenplan zur Umsetzung der Fraktal40-Besprechung.

  Fokus auf stabile Kern-Builds, dist-first Services, verschärfte Governance

  und dokumentierte Release-Drills.

  '
streams:
  - key: stability
    owner:
      lead: Codex CoreOps / CodexAuditAgent
      backup: SyncRunner Nightly Stewardship
    objective: Core- und Extended-Builds dauerhaft grün halten.
    related_files:
      - .github/workflows/ci.core.yml
      - .github/workflows/ci.experimental.yml
      - ci/agent.yml
    checkpoints:
      - id: core-ci-hardening
        description: Fail-fast Verhalten und Nightly-Matrix in CI Core etablieren
        status: done
        notes: 'ci.nightly.yml spiegelt type-and-tests; Toolchain-Artefakt + Alert-Auswertung
          aktiv (Fraktal44).

          JetStream-Bus-Test läuft unter Vitest; CI-Core startet einen Docker-basierten
          NATS-Server und ruft `pnpm nats:doctor` sowie `pnpm test:jetstream` im type-and-tests-Gate
          auf (Fraktal57). `pnpm nats:doctor` liefert detaillierte Hinweise (fehlendes `-js`,
          Timeout/Proxy, Berechtigungen) und nutzt `$JS.API.INFO` als Fallback. Lokale Workflows
          verwenden `pnpm nats:docker` für JetStream-Container, `pnpm dev:stack` prüft Ports
          und räumt sie standardmäßig via kill-port auf (Opt-out: `UM_DEV_SERVICES_AUTOFREE_PORTS=0`)
          und verweist bei Bedarf auf `pnpm dev:ports:free`. Runbook `docs/runbooks/nats-jetstream.md`
          dokumentiert Setup und Troubleshooting, README & Tests-Runbook spiegeln die neuen Hinweise.

          Fraktal61: CI-Core führt zusätzlich `pnpm test:unit:coverage` mit Coverage aus und veröffentlicht
          den Report als Artefakt (`coverage-vitest`).

          Fraktal64+: Core-, Extended- und Nightly-Jobs installieren `src/adapters/requirements.txt`, sodass
          NetCDF4/h5netcdf/scipy offline verfügbar sind; `PANTHEON_DISABLE=1` deaktiviert Pantheon-Analytics
          in QA-Läufen, Coverage-Jobs nutzen `pnpm test:unit:coverage` konsistent und Pytests sichern die
          STAC-HREF-Normalisierung gegen Item-Verzeichnisse ab.
          Fraktal65: CI-Core setzt auf die Skript-Aliase `pnpm typecheck`, `pnpm test:unit` und `pnpm test:unit:coverage`,
          Governance-Workflows laufen mit `pnpm schema:validate`, `pnpm maps:validate`, `pnpm policy:check`, und Repo-Sanity
          prüft `ciBehaviour`-Felder via `pnpm sanity`.

          Fraktal73: Windows-Setup (`scripts/setup-dev-env.ps1`) erkennt Docker-basierte `nats`-Container, exportiert Status /
          Start-Hinweise im InstallReport und Runbooks/README dokumentieren `docker ps -a ...`, `docker start nats`,
          `docker logs --tail=50 nats` sowie den PowerShell-Portcheck `Test-NetConnection 127.0.0.1 -Port 4222`.

          Fraktal74: Husky-Hooks führen `pnpm check:precommit`/`pnpm check:prepush` mit optionalem `UM_SKIP_HEAVY_HOOKS=1`-Bypass,
          neue Aliase `check:ci`/`ci:verify` bündeln die Gates und die Workflows `check-ci.yml`/`ci-verify.yml` spiegeln den Lauf;
          `scripts/ci-verify.mjs` plus `scripts/sanity/check-keys-empty.mjs` sichern Repo-Sanity (`keys/` leer) im CI; der Mini-Sigillin-Validator
          besitzt jetzt einen CLI-Guard (argv + stdin-Typisierung), womit `pnpm typecheck` grün bleibt.

          '
        success:
          - pnpm test:ts:ci
          - pnpm test:unit:coverage
          - pnpm test:py
          - npx pyright
      - id: experimental-signal
        description: Guardrails & Agent Dry-Runs ohne `|| true`; Ergebnisse als Checks
          publizieren
        status: done
        notes: Guardrails/Agents laufen fail-fast; Nightly Alerts verlinken Issues (Fraktal44)
        artifacts:
          - agents-dry-run.log
          - out/policy/policy-suite.json
      - id: policy-suite-unify
        description: pnpm policy:check bündelt OPA, Guardrails und Kyverno
        status: done
        notes: |-
          Fraktal60: policy:check ruft sigillins:report auf und erzeugt Artefakte in out/policy/sigillins/.
          Fraktal61: policy-check.yml lädt die Sigillin-Governance-Berichte als separates GitHub-Artefakt (`policy-sigillins`).
          Fraktal65: Governance-Workflow ruft zusätzlich `pnpm schema:validate` und `pnpm maps:validate` auf; Repo-Sanity nutzt `pnpm sanity`, um `ciBehaviour`-Metadaten zu prüfen.
          Fraktal66: Policy-Suite markiert Kyverno/Sigillin als optionale Schritte (`PANTHEON_DISABLE=1`), loggt Skip-Warnungen wenn Kyverno-CLI oder `sigillins:report` fehlen, `pnpm repomap:*` erzeugt Fallback-Artefakte bei fehlendem dist und das Cheat Sheet `docs/cheatsheets/unified-mandala-workflows.md` bündelt die Kern-Workflows.
          Fraktal68: keys/ bleibt automation-only; Repo-Sanity prüft `.gitignore`/`.gitkeep` und `policies/kyverno.yaml` meldet unerwartete Dateien.
        output:
          - out/policy/policy-suite.json
          - out/policy/policy-suite.md
          - out/policy/sigillins/sigillins-junit-report.xml
          - out/policy/sigillins/sigillins-report.md
          - policy-sigillins (GitHub artifact)
  - key: code-quality
    owner:
      lead: DevX Guild
      backup: PatternReactivator Collective
    objective: Linting, Formatting und Skriptlandschaft konsolidieren.
    related_files:
      - package.json
      - .husky/pre-commit
      - scripts/dev-services.mjs
      - docker-compose.yml
    checkpoints:
      - id: lint-doc-refresh
        description: README/CONTRIBUTING mit Dist-First und Hook-Hinweisen erweitern
        status: done
        notes: |-
          README & CONTRIBUTING beschreiben scripts/run-dist.mjs inkl. `UM_RUN_DIST_*` Overrides; Windows-Onboarding
          referenziert `scripts/setup-dev-env.ps1` und `scripts/run-powershell.mjs`. PowerShell-Setup exportiert den
          Installationsstatus nach `out/setup/install-state.json` für Codexfeedback-Läufe; ParserFix `(Test-CommandExists ...)`
          + Bool-Cast beheben den PowerShell 7 ParserError aus DevTalk 55. Corepack-Admin-Detection vermeidet EPERM,
          protokolliert den Aktivierungsmodus im InstallReport und ergänzt README/Onboarding/Command-Catalog um
          NATS-Hinweise (winget/Docker) für `pnpm start:all`.
          README & Tests-Runbook listen `pnpm nats:docker` sowie `pnpm dev:ports:free`; Emergence-Scan fällt auf
          docs/sigillin/GENESIS.md zurück, wenn SIGILLIN_GENESIS.md fehlt; Quickstart (Windows · PowerShell) erklärt
          `UI_DEV_URL`-Overrides und JetStream-Setup, `SIGILLIN_GENESIS.md` liegt als Placeholder im Repo. README
          Quickstart (PowerShell) ergänzt Hinweise zu `Get-Content`/`type` und `$env:`-Zuweisungen; docs/maps/RepoMap.yaml
          führt `repo`, ProgramFlow.yaml einen `meta`-Block, wodurch `pnpm maps:validate` wieder grün läuft. Fraktal67
          erweitert das Cheat Sheet um `pnpm check:ci`, `pnpm ci:verify`, Monitoring-/Offline-Bundle-Hinweise und verweist
          explizit auf `scripts/setup-dev-env.ps1`.
          Fraktal70 erweitert README sowie `docs/demos/cosmic-web.md` um eine plattformfreundliche Cosmic-Web-Anleitung,
          warnt vor HTTP-Requests auf Port 4222, verlinkt `scripts/realtime/sub-cosmic.mjs` (`pnpm sub:cosmic`, Default-Subject
          `demo.cosmic`) und nennt das neue Testskript `pnpm test:unit:crep`.
          Fraktal72 beschreibt den Pytest-Wrapper `scripts/run-pytest.mjs` (auto `.venv`), empfiehlt weiterhin
          `pnpm exec cypress install`, dokumentiert den Mandala-Erklärungscheck `pnpm sigils:validate:mini` und legt
          `prompts:coach` auf den Dist-First-Runner (`scripts/run-dist.mjs scripts/prompt-coach.ts`) inklusive
          Command-Catalog-Aktualisierungen.
      - id: ts-node-retire
        description: Produktionspfade auf `node dist/...` umstellen
        status: done
        notes: scripts/run-dist.mjs ersetzt ts-node in Paket-Skripten
  - key: build-release
    owner:
      lead: ReleaseOps Circle
      backup: VisionContextIntegrator
    objective: Dist-First-Builds, Docker-Drills und Smoke-Tests automatisieren.
    related_files:
      - Dockerfile
      - Dockerfile.dev
      - scripts/light-static-server.mjs
      - docker-compose.yml
    checkpoints:
      - id: dist-first
        description: '`pnpm build` liefert alle Artefakte für Prod-Start ohne ts-node'
        status: done
        notes: Dockerfile.dev auf Node20/Python3 gehoben; Dist-First CLI & Dev-Skripte
          aktualisiert (Fraktal44). Adapter-Build-Kommandos verwenden `scripts/lib/python.mjs`
          und `scripts/adapter-build-era5.mjs`, sodass `pnpm adapter:build:*` die Projekt-venv
          auch unter Windows findet (Fraktal57). `_normalise_href` berechnet Asset-HREFs relativ
          zum STAC-Item-Verzeichnis (Fallback auf `file://`), die Engine-Präferenz umfasst nun
          `netcdf4 → h5netcdf → scipy`, und Root-Requirements pinnen `h5netcdf`, damit Offline-Builds
          stabil bleiben.
      - id: compose-profiles
        description: docker-compose Profile für core/newsbot/climate definieren
        status: done
        notes: docker-compose Profile für core/newsbot/climate/llm/global/agents/monitoring
          aktiv.
      - id: runtime-smoke
        description: '`pnpm start:light` + HTTP-Smoketest automatisieren'
        status: done
        notes: Light-static smoke script (`pnpm smoke:light-static`) Teil der Release-Checklist
          & Monitoring-Auswertung (Fraktal44).
  - key: governance
    owner:
      lead: AI Governance Council
      backup: PactDepthGatekeeper
    objective: Transparente Policy-Gates & Dokumentation.
    related_files:
      - scripts/policy-suite.mjs
      - AI_POLICY.md
      - policies/merge-guardrails.yaml
    checkpoints:
      - id: kyverno-integration
        description: Kyverno CLI in policy-suite aufnehmen
        status: done
      - id: policy-docs
        description: AI_POLICY.md/Ai_POLICY.yaml mit Allow/Deny Beispielen ergänzen
        status: done
        notes: Entscheidungsbeispiele dokumentiert (Allow/Review/Block)
      - id: sigillin-validator
        description: Sigillin-Validator + CI-Workflow etablieren
        status: done
        notes: pnpm validate:sigillins + .github/workflows/sigillin-validate.yml aktiv
          (Fraktal44); pnpm dev:breath koppelt validate:sigillins & trikaya:dashboard
          an Dateiänderungen und meldet Coverage.
        artifacts:
          - scripts/validate-sigillins.mjs
          - scripts/schemas/mandala-sigillin.schema.json
          - .github/workflows/sigillin-validate.yml
  - key: observability
    owner:
      lead: TelemetryOps / GenesisAeonNavigator
      backup: Health Package Maintainers
    objective: Prometheus/Grafana in den Release-Fluss integrieren.
    related_files:
      - observability/prometheus.yml
      - observability/grafana
      - packages/health
    checkpoints:
      - id: metrics-endpoints
        description: Alle Services exportieren `/metrics` via @um/health
        status: done
        notes: '@um/health integriert, Monitoring-Smokes im Release-Drill geprüft (Fraktal44); Fraktal72 liefert `pnpm observability:check` für Prometheus `/api/v1/targets` + Grafana `/api/health` (Port 3300).'
      - id: prom-compose
        description: Compose-Profile für Prometheus/Grafana aktivieren
        status: done
milestones:
  - name: Sprint 0 – Playbook Review
    target: 2025-09-24
    deliverables:
      - Playbook im Team abgestimmt
      - Aufgaben in Issue-Board gespiegelt
  - name: Sprint 1 – Core Stabilization
    target: 2025-10-01
    deliverables:
      - core-ci-hardening
      - policy-suite-unify
      - kyverno-integration
  - name: Sprint 2 – Extended & Docs
    target: 2025-10-08
    deliverables:
      - experimental-signal
      - lint-doc-refresh
      - runtime-smoke
  - name: Sprint 3 – Release Drill
    target: 2025-10-15
    deliverables:
      - dist-first
      - compose-profiles
      - prom-compose
tracking:
  codexfeedback_hook: fraktal40
  progress_log:
    - file: codexfeedback.md
      action: neue Laufnotizen hinzufügen
    - file: codexfeedback.json
      action: statusflag aktualisieren
    - file: codexfeedback.yaml
      action: current=40 setzen, checkpoints pflegen
    - file: codexfeedback-fraktal44.yaml
      action: Abschluss & Hook-Status spiegeln
    - file: fraktal44.md
      action: Systemanalyse & Done/ToDo-Matrix dokumentieren
  follow_up:
    - file: advancedprogress.json
      action: Sprint-Ergebnisse spiegeln
risks:
  - id: ci-flakes
    description: Persistente Vitest/Pytest-Flakes können Fail-Fast-Ansatz ausbremsen
    mitigation: Tests taggen, Retries nur in Nightlies zulassen, Flake-Issues pflegen
  - id: docker-toolchain-drift
    description: Unterschiedliche Node-Versionen (Dockerfile vs Dockerfile.dev)
    mitigation: Baseline auf Node 20 angleichen, Renovate/Dependabot für Images erwägen
  - id: policy-tooling-gaps
    description: Kyverno/OPA Binaries nicht auf Runner verfügbar
    mitigation: Fallback auf Containerized CLI, Preflight-Check in policy-suite
