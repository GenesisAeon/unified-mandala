fraktal: 40
release: v1.0
owner: codex
updated: '2025-10-19'
summary: 'Strukturierter Maßnahmenplan zur Umsetzung der Fraktal40-Besprechung.

  Fokus auf stabile Kern-Builds, dist-first Services, verschärfte Governance

  und dokumentierte Release-Drills.

  '
streams:
  - key: stability
    owner:
      lead: Codex CoreOps / CodexAuditAgent
      backup: SyncRunner Nightly Stewardship
    objective: Core- und Extended-Builds dauerhaft grün halten.
    related_files:
      - .github/workflows/ci.core.yml
      - .github/workflows/ci.experimental.yml
      - ci/agent.yml
    checkpoints:
      - id: core-ci-hardening
        description: Fail-fast Verhalten und Nightly-Matrix in CI Core etablieren
        status: done
        notes: 'ci.nightly.yml spiegelt type-and-tests; Toolchain-Artefakt + Alert-Auswertung
          aktiv (Fraktal44).

          JetStream-Bus-Test läuft unter Vitest; CI-Core startet einen Docker-basierten
          NATS-Server und ruft `pnpm nats:doctor` sowie `pnpm test:jetstream` im type-and-tests-Gate
          auf (Fraktal57). Lokale Workflows verwenden `pnpm nats:docker` für JetStream-Container
          und `pnpm dev:ports:free`/Port-Wächter im Dev-Stack, um Windows-Portkollisionen
          früh zu erkennen.

          '
        success:
          - pnpm test:ts:ci
          - pnpm test:py
          - npx pyright
      - id: experimental-signal
        description: Guardrails & Agent Dry-Runs ohne `|| true`; Ergebnisse als Checks
          publizieren
        status: done
        notes: Guardrails/Agents laufen fail-fast; Nightly Alerts verlinken Issues (Fraktal44)
        artifacts:
          - agents-dry-run.log
          - out/policy/policy-suite.json
      - id: policy-suite-unify
        description: pnpm policy:check bündelt OPA, Guardrails und Kyverno
        status: done
        output:
          - out/policy/policy-suite.json
          - out/policy/policy-suite.md
  - key: code-quality
    owner:
      lead: DevX Guild
      backup: PatternReactivator Collective
    objective: Linting, Formatting und Skriptlandschaft konsolidieren.
    related_files:
      - package.json
      - .husky/pre-commit
      - scripts/dev-services.mjs
      - docker-compose.yml
    checkpoints:
      - id: lint-doc-refresh
        description: README/CONTRIBUTING mit Dist-First und Hook-Hinweisen erweitern
        status: done
        notes: "README & CONTRIBUTING beschreiben scripts/run-dist.mjs inkl. `UM_RUN_DIST_*`\
          \ Overrides; Windows-Onboarding referenziert `scripts/setup-dev-env.ps1` und\
          \ `scripts/run-powershell.mjs`. PowerShell-Setup exportiert den Installationsstatus\
          \ nach `out/setup/install-state.json` für Codexfeedback-Läufe; ParserFix `(Test-CommandExists\
          \ ...)` + Bool-Cast beheben den PowerShell 7 ParserError aus DevTalk 55. Corepack-Admin-Detection\
          \ vermeidet EPERM, protokolliert den Aktivierungsmodus im InstallReport und\
          \ ergänzt README/Onboarding/Command-Catalog um NATS-Hinweise (winget/Docker)\
          \ für `pnpm start:all`.\n           README & Tests-Runbook listen `pnpm nats:docker`\
          \ sowie `pnpm dev:ports:free`; Emergence-Scan fällt auf docs/sigillin/GENESIS.md\
          \ zurück, wenn SIGILLIN_GENESIS.md fehlt."
      - id: ts-node-retire
        description: Produktionspfade auf `node dist/...` umstellen
        status: done
        notes: scripts/run-dist.mjs ersetzt ts-node in Paket-Skripten
  - key: build-release
    owner:
      lead: ReleaseOps Circle
      backup: VisionContextIntegrator
    objective: Dist-First-Builds, Docker-Drills und Smoke-Tests automatisieren.
    related_files:
      - Dockerfile
      - Dockerfile.dev
      - scripts/light-static-server.mjs
      - docker-compose.yml
    checkpoints:
      - id: dist-first
        description: '`pnpm build` liefert alle Artefakte für Prod-Start ohne ts-node'
        status: done
        notes: Dockerfile.dev auf Node20/Python3 gehoben; Dist-First CLI & Dev-Skripte
          aktualisiert (Fraktal44). Adapter-Build-Kommandos verwenden `scripts/lib/python.mjs`
          und `scripts/adapter-build-era5.mjs`, sodass `pnpm adapter:build:*` die Projekt-venv
          auch unter Windows findet (Fraktal57).
      - id: compose-profiles
        description: docker-compose Profile für core/newsbot/climate definieren
        status: done
        notes: docker-compose Profile für core/newsbot/climate/llm/global/agents/monitoring
          aktiv.
      - id: runtime-smoke
        description: '`pnpm start:light` + HTTP-Smoketest automatisieren'
        status: done
        notes: Light-static smoke script (`pnpm smoke:light-static`) Teil der Release-Checklist
          & Monitoring-Auswertung (Fraktal44).
  - key: governance
    owner:
      lead: AI Governance Council
      backup: PactDepthGatekeeper
    objective: Transparente Policy-Gates & Dokumentation.
    related_files:
      - scripts/policy-suite.mjs
      - AI_POLICY.md
      - policies/merge-guardrails.yaml
    checkpoints:
      - id: kyverno-integration
        description: Kyverno CLI in policy-suite aufnehmen
        status: done
      - id: policy-docs
        description: AI_POLICY.md/Ai_POLICY.yaml mit Allow/Deny Beispielen ergänzen
        status: done
        notes: Entscheidungsbeispiele dokumentiert (Allow/Review/Block)
      - id: sigillin-validator
        description: Sigillin-Validator + CI-Workflow etablieren
        status: done
        notes: pnpm validate:sigillins + .github/workflows/sigillin-validate.yml aktiv
          (Fraktal44); pnpm dev:breath koppelt validate:sigillins & trikaya:dashboard
          an Dateiänderungen und meldet Coverage.
        artifacts:
          - scripts/validate-sigillins.mjs
          - scripts/schemas/mandala-sigillin.schema.json
          - .github/workflows/sigillin-validate.yml
  - key: observability
    owner:
      lead: TelemetryOps / GenesisAeonNavigator
      backup: Health Package Maintainers
    objective: Prometheus/Grafana in den Release-Fluss integrieren.
    related_files:
      - observability/prometheus.yml
      - observability/grafana
      - packages/health
    checkpoints:
      - id: metrics-endpoints
        description: Alle Services exportieren `/metrics` via @um/health
        status: done
        notes: '@um/health integriert, Monitoring-Smokes im Release-Drill geprüft (Fraktal44)'
      - id: prom-compose
        description: Compose-Profile für Prometheus/Grafana aktivieren
        status: done
milestones:
  - name: Sprint 0 – Playbook Review
    target: 2025-09-24
    deliverables:
      - Playbook im Team abgestimmt
      - Aufgaben in Issue-Board gespiegelt
  - name: Sprint 1 – Core Stabilization
    target: 2025-10-01
    deliverables:
      - core-ci-hardening
      - policy-suite-unify
      - kyverno-integration
  - name: Sprint 2 – Extended & Docs
    target: 2025-10-08
    deliverables:
      - experimental-signal
      - lint-doc-refresh
      - runtime-smoke
  - name: Sprint 3 – Release Drill
    target: 2025-10-15
    deliverables:
      - dist-first
      - compose-profiles
      - prom-compose
tracking:
  codexfeedback_hook: fraktal40
  progress_log:
    - file: codexfeedback.md
      action: neue Laufnotizen hinzufügen
    - file: codexfeedback.json
      action: statusflag aktualisieren
    - file: codexfeedback.yaml
      action: current=40 setzen, checkpoints pflegen
    - file: codexfeedback-fraktal44.yaml
      action: Abschluss & Hook-Status spiegeln
    - file: fraktal44.md
      action: Systemanalyse & Done/ToDo-Matrix dokumentieren
  follow_up:
    - file: advancedprogress.json
      action: Sprint-Ergebnisse spiegeln
risks:
  - id: ci-flakes
    description: Persistente Vitest/Pytest-Flakes können Fail-Fast-Ansatz ausbremsen
    mitigation: Tests taggen, Retries nur in Nightlies zulassen, Flake-Issues pflegen
  - id: docker-toolchain-drift
    description: Unterschiedliche Node-Versionen (Dockerfile vs Dockerfile.dev)
    mitigation: Baseline auf Node 20 angleichen, Renovate/Dependabot für Images erwägen
  - id: policy-tooling-gaps
    description: Kyverno/OPA Binaries nicht auf Runner verfügbar
    mitigation: Fallback auf Containerized CLI, Preflight-Check in policy-suite
