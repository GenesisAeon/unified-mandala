  sigillin_type: agent-sigil
  audience: CosmicTheory Maintainers
  essenz: >-
    CREP harmonisiert Analyse, damit der CosmicTheoryAgent Coherence, Resonance,
    Emergence und Poetics verbindet und der Trikāya-Bezug in allen Modulen bleibt.
