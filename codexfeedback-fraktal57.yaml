summary:
  - JetStream-Bus-Test von Jest nach Vitest migriert (`tests/event-bus/jetstream-bus.test.ts`),
    inklusive Durable/ManualAck-Assertion und Vitest-Mock für `nats`.
  - CI-Core (`.github/workflows/ci.core.yml`) startet einen Docker-basierten NATS-Server
    (-js) und führt `pnpm nats:doctor`, `pnpm test:ts:ci` sowie `pnpm test:jetstream`
    sequenziell aus.
  - '`scripts/nats-doctor.mjs` validiert JetStream mit konfigurierbaren Retries/Delays,
    fällt bei API-Drift auf `$JS.API.INFO` zurück und liefert Troubleshooting-Hinweise
    (fehlendes `-js`, Timeout/Proxy, Berechtigungen) für CI-Logs und lokale Läufe.'
  - '`package.json` ergänzt `test:jetstream`, `nats:doctor`, aktualisiert `check:ci`
    und deklariert `test:jest` als Vitest-Hinweis.'
  - Dokumentationsartefakte (README inkl. Windows-Quickstart, docs/runbooks/tests.md,
    neues docs/runbooks/nats-jetstream.md, command-catalog.*, MandalaMap.*, Playbook)
    spiegeln den JetStream-Flow; `analysis/scripts-and-commands.json` & `codexfeedback.yaml`
    synchronisiert.
  - '`scripts/dev-services.mjs` prüft Ports vor dem Start, räumt Standard-Ports automatisch
    via `pnpm dlx kill-port` auf (Opt-out `UM_DEV_SERVICES_AUTOFREE_PORTS=0`) und verlinkt
    `pnpm dev:ports:free`; neues `scripts/nats-docker.mjs` orchestriert JetStream-Container
    (`pnpm nats:docker`), `scripts/flags-api.ts` nutzt dedizierten Port und der Emergence-Scan
    nutzt einen eingecheckten `SIGILLIN_GENESIS.md`-Placeholder bzw. Fallback auf `docs/sigillin/GENESIS.md`.'
  - 'Adapter-Builds sind Windows-tauglich: `scripts/lib/python.mjs` lokalisiert .venv-Interpreter, `pnpm adapter:build:era5` läuft über `scripts/adapter-build-era5.mjs` und die OISST/EFFIS-Skripte verwenden denselben Helper für Cross-Platform-Spawns.'
