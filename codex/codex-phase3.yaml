name: unified-mandala-phase-3
description: |
  Vollständige Weiterentwicklung des UnifiedMandala-Kerns.
  Fokus auf visuelle Erweiterungen, CREP-Systemintegration, Symbolzeitlogik und GPT-Anbindung.

tasks:

  - title: "Integriere CREPPhaseMatrix.yaml in crep-engine"
    path: packages/crep-engine/data/CREPPhaseMatrix.yaml
    description: |
      Matrix zur Bewertung von CREP-Werten in Zustandsbereichen (safe, warning, critical).
    content: |
      phase_matrix:
        critical:
          coherence: "< 4"
          resonance: "< 4"
          emergence: "< 4"
        safe:
          coherence: ">= 7"
          resonance: ">= 7"
          emergence: ">= 7"
        warning:
          coherence: ">= 4 && < 7"
          resonance: ">= 4 && < 7"
          emergence: ">= 4 && < 7"

  - title: "Erzeuge SymbolzeitTrigger-Modul"
    path: packages/aeon-shell/symbolzeit.ts
    description: |
      Exportiere aktuelle Symbolzeitphase (morgen, tag, abend, nacht) für das Mandalasystem.
    content: |
      export const SYMBOLZEIT = {
        phase: "abend",
        date: new Date().toISOString()
      };

  - title: "Aktualisiere MandalaNetworkView mit CREPMatrix-Farben"
    path: packages/unifiedmandala-ui/components/MandalaNetworkView.tsx
    description: |
      Farblogik der Knoten aktualisieren basierend auf CREPPhaseMatrix.
    notes: |
      Nutze symbolische Farben: rot (kritisch), gelb (warning), grün (safe).
    insert_function:
      name: getCREPPhaseColor
      code: |
        function getCREPPhaseColor(crep) {
          const { C, R, E } = crep;
          if (C < 4 || R < 4 || E < 4) return "red";
          if (C >= 7 && R >= 7 && E >= 7) return "green";
          return "orange";
        }

  - title: "Baue SigillinLoader-Komponente"
    path: packages/unifiedmandala-ui/components/SigillinLoader.tsx
    description: |
      UI-Komponente zum dynamischen Laden und Filtern von Sigillin.
    stub: true
    notes: |
      Ermöglicht Auswahl nach Typ, CREP-Wert oder Textsuche.

  - title: "Lege GPT-Synapse-Modul an"
    path: packages/gpt-bridges/aeon-gpt-synapse.ts
    description: |
      Zentrale Brücke zwischen UnifiedMandala und GPT-Modulen.
    content: |
      export interface GPTRequest {
        role: "aeon" | "crep" | "poet";
        input: string;
        context?: any;
      }

      export function sendToGPT(request: GPTRequest) {
        console.log("Stub für GPT-Verbindung:", request);
        return "Dies ist ein GPT-Stubsignal.";
      }

  - title: "Lege GPT-AEONPOET- und GPT-CREPJUDGE-Stubs an"
    path: packages/gpt-bridges/
    files:
      - gpt-aeonpoet.ts
      - gpt-crepjudge.ts
    content: |
      export function GPT_AEONPOET(input: string) {
        return `🜂 Poetisches Echo: ${input}`;
      }

      export function GPT_CREPJUDGE(crep) {
        if (crep.C < 4 || crep.R < 4 || crep.E < 4) return "⚠️ Zustand kritisch";
        if (crep.C >= 7 && crep.R >= 7 && crep.E >= 7) return "🟢 Zustand stabil";
        return "🟠 Zustand unsicher";
      }

  - title: "Bereite sharedream-SyncModul vor"
    path: packages/sharedream-interface/sync.ts
    description: |
      Sync-Modul zur Übergabe von CREP-Zustand und SigillinMap an Website oder externen Viewer.
    content: |
      import sigillin from "../unifiedmandala-ui/data/sigillin_nodes.json";
      import { getCREPState } from "../crep-engine/CREPEvaluator";

      export function syncSharedream() {
        return {
          sigillin,
          crepStates: sigillin.map(s => ({
            id: s.id,
            status: getCREPState(s.crep)
          }))
        };
      }

  - title: "Baue onboarding-flow.tsx mit CHRONOPOEM-Anbindung"
    path: packages/unifiedmandala-ui/components/onboarding-flow.tsx
    description: |
      Visuelles Onboarding mit poetischer Begleitung aus CHRONOPOEM.md.
    stub: true
    notes: |
      Beginne mit Seitenstruktur und Dummy-Daten.
