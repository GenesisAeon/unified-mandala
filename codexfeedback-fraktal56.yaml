  - 'PowerShell 7.5 ParserError behoben: `Ensure-Tool` nutzt jetzt `(Test-CommandExists ...)` in `-and`-Ausdrücken und castet Installationsresultate zu Bool, sodass der Dev-Setup-Lauf auf Windows wieder durchläuft.'
