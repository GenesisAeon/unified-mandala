# Globale Leitplanken für Agenten
defaults:
  max_qps: 2
  max_concurrency: 2
  request_timeout_ms: 120000
  retry: { attempts: 3, base_delay_ms: 400, jitter: true }
  circuit_breaker: { failure_threshold: 5, cooldown_ms: 60000 }
  allowed_domains:
    - "noaa.gov"
    - "ecmwf.int"
    - "copernicus.eu"
    - "pegelonline.wsv.de"
    - "effis.jrc.ec.europa.eu"
    - "gbif.org"
    - "dwd.de"
  user_consent_required: false
  metrics:
    sink_logs: "data/agents/logs/"
    sink_metrics: "data/agents/metrics/"
agents: {}
