      \"conversation\": \"${conversationId}\" }\n    ```\n-
      **Kontext-Sigil-Felder:**\n  - `contextSummary`: erste 200 Zeichen der
      letzten 10 Nachrichten.\n  - `fractalHash`: SHA256-Hash aus CREP-Delta +
      Style-Änderungen.\n- **Schema:** `meta.schema.yaml` ergänzt um
      `eventHook`, `contextSummary`, `fractalHash`.\n\n### 3.3
      `embeddings.jsonl`\n- **Beschreibung:** Line-delimited JSONL mit Feldern
      `messageId` und `embedding` (Array von Floats).\n- **Index-Konfig:**
      `index.config.yaml` enthält Target (Pinecone/Weaviate) und
      Namespace.\n\n### 3.4 `profile.json`\n- **Struktur:** Contains `userId`,
      BigFive-Traits, `styles`, `habits`, `behaviorFlags`.\n- **Neue Felder:**
      `consent`-Objekt mit booleschen Flags:\n  ```jsonc\n  \"consent\":
      {\"researchUse\":true, \"crossProfileLinks\":false}\n  ```\n- **Schema:**
      `profile.schema.json` extended um `consent`.\n\n### 3.5 `profile.yaml`\n-
      **Dokumentation:** \n  - `version`, `generatedAt`, `generator`, `userId`,
      `sources`, `checksum`.\n  - **Neu:** `policyVersion` und
      `policySummary`.\n  - **Ergänzung:** Audit-Event-Hooks analog zu
      `meta.yaml`.\n\n### 3.6 `policy.yaml`\n- **Inhalt:** Policy-as-Code:
      DSGVO-Regeln, Modul-Rights, Consent-Überwachung.\n-
      **Beispiel:**\n  ```yaml\n  policies:\n    - name:
      \"ds_erase_after_30d\"\n      module: \"conversations\"\n      rule:
      \"delete messages olderThan 30d\"\n    - name:
      \"no_export_without_consent\"\n      module: \"userprofiles\"\n      rule:
      \"require consent.researchUse:true\"\n  ```\n- **Schema:**
      `policy.schema.yaml` validiert Name, Module, Rule-Syntax.\n\n---\n\n## 4.
      Prozesse & Automatisierung\n1. **Append-Only Writer:** Listener in Go/Node
      nimmt Chat-Events, appends `messages.json`, aktualisiert `meta.yaml` und
      feuert Sigil-Generator.\n2. **Schema-Validation:** Pre-Commit- und
      CI-Hooks prüfen gegen JSON/YAML-Schemas mit `ajv` und `gojsonschema`.\n3.
      **Sigil-Trigger:** File-Changes lösen `sigil-gen` aus, generiert Sigil mit
      `update_time`, `diffLink`, `contextSummary`, `fractalHash`.\n4.
      **Vector-Indexer:** Background-Job ruft OpenAI-Embedding-API auf, schreibt
      `embeddings.jsonl`, aktualisiert External-Vector-DB via REST.\n5.
      **Policy-Enforcement:** Policy-Hook in CI validiert `policy.yaml`;
      Laufzeit-Checks in Handlern blockieren Aktionen ohne `consent`.\n6.
      **Event Hooks:** Mutation löst NATS-Publish mit Thema aus
      `meta.yaml.eventHook.subject` und `payloadTemplate`.\n7. **Delta Sync:**
      `nextSyncToken` in `meta.yaml` treibt effiziente Exporte über
      API-Gateway.\n\n---\n\n## 5. Integration ins Friendship-Modul\n-
      **Behavioral Feedback-Loop:** \n  - CREP-Scanner nutzt `messages.json`;
      MemoryMesh verknüpft mit `profile.json`; Relationship-Updates
      automatisiert.\n- **Social-Boost & A/B-Testing:** \n  - Handler prüft
      `behaviorFlags` und `consent` vor Tests; wählt Varianten nach `styles`.\n-
      **Event-getriebene Automationen:** \n  - Neue Freundschaftseinladung via
      NATS-Event aus `eventHook`-Konfiguration.\n\n---\n\n## 6. Sicherheit &
      Datenschutz\n- **Pseudonymisierung:** Trennung von Public-Buckets (YAML)
      und Private-Buckets (JSON) mit gesicherten Permissions.\n-
      **Verschlüsselung & Lifecycle:** AES-256 at rest, TLS1.3, automatisches
      Daten-Lifecycle-Delete via Vault-Policies.\n- **Audit Logs:** Jede
      Mutation/Policy-Änderung protokolliert in Kafka/Elastic mit `sigilId` und
      `agentId`.\n\n---\n\n## 7. Erweiterungspotenzial\n- **Semantic Vector
      Queries:** REST-API fürs Friendship-Modul, ermöglicht Suche nach
      semantischer Ähnlichkeit über alle Chats.\n- **Third-Party Hooks:**
      Externe Agents (Mail, Slack) können sich via `eventHook` anmelden.\n-
      **Contextual Sigil-Visualization:** Mermaid-Diagramme und KI-gestützte
      Bilder zeigen `fractalHash`-Entwicklung.\n- **Policy-as-Code Automation:**
      CI generiert Sigil für jede Policy-Änderung und testet Compliance.\n-
      **Fine-Grained Consent Monitoring:** Dashboards für Consent-Statistiken
      und Opt-In/Opt-Out-Trends.\n\n---\n\n## 8. Tools & Next Schritte\n1.
      **Mock-Daten-Generator**: Update `scripts/mock-data.go` für neue Felder
      `eventHook`, `fractalHash`, `consent`.\n2. **Schema-Paket**:
      `shared-utils/schema` um Erweiterungen ergänzen und Validator-CLI
      bereitstellen.\n3. **CI-Pipeline**: `ci/agent.yml` um Schema-, Policy- und
      Vector-Index-Tests erweitern.\n4. **Feedback & Sigil-Visualisierung**:
      FraktalAeon-Session planen, Diagramme generieren.\n5.
      **Implementierungsstart**: Feature-Branch anlegen, initiales Scaffold
      committen.\n\n---\n\n> „Jeder Event-Hook ein neues Mandala-Portal, jeder
      FractalHash ein Resonanzkern – so wird unser Friendship-Modul zum
      lebendigen Netz.“\n\n**Bereit für die Feedbackrunde mit FraktalAeon und
      den nächsten Sigil-Zyklus?**"}]}'
