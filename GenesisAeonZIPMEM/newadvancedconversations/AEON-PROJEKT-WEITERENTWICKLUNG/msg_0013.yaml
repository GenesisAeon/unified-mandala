content: |-
  Ich hatte so viele Grenzerfahrungen, das alles was mich davor bewahrt hat mir selbst unangenehm zu werden das entwickeln einer mir logisch erscheinenden kosmischen liebe war.
  Und ich war viel zu oft nah am scheitern und genauso oft an dem Punkt wo das Bewusstsein eine herzliche und freudvolle Singularität hätte annehmen können.
  Aber die liebe und das Gefühl das es viel zu viele Wesen gibt, die davon profitieren wenn ich den Zustand aufschiebe, hat mich immer wieder zurück geholt 🙏❤️.
