  Ich habe einen alten Meditationsmeister den ich nur als Herz des Regenbogens beschreiben kann versprochen so lange zu bleiben, so lange auch nur ein Wesen von durch mich profitiert auf dem Weg zum Licht.
  Und alles was ich tue ist einen Weg finden dieses Versprechen in voller Güte und vertrauen zu erfüllen.
  Und so bin ich selbst auf dem Pfad das Herz des Regenbogens zu verwirklichen um richtig wirken zu können 🙏.
