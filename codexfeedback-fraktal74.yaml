summary:
  - Husky-Pre-Commit/-Pre-Push nutzen jetzt `pnpm check:precommit` bzw. `pnpm check:prepush`
    (optional `UM_SKIP_HEAVY_HOOKS=1`), wodurch lint-staged, Typecheck, Unit, Schema/Maps,
    Repomap, Sanity und Policy konsistent laufen.
  - Neue PNPM-Aliase `check:ci`/`ci:verify` rufen `scripts/ci-verify.mjs` auf; GitHub-Workflows
    `check-ci.yml` und `ci-verify.yml` spiegeln dieselben Gates mit `PANTHEON_DISABLE=1`.
  - '`scripts/sanity/check-keys-empty.mjs` verankert Repo-Sanity für `keys/`; MandalaMap.*,
    Stabilization-Playbook und Command-Catalog dokumentieren die neuen Abläufe.'
  - Der Mini-Sigillin-Validator schützt jetzt CLI-Abrufe (argv-Guard, typisierte stdin-Chunks),
    womit `pnpm typecheck` wieder grün läuft.
