version: 2
tasks:
  - id: env.setup
    run:
      - pnpm add -D ts-node yaml nats ws ajv micromatch
    verify:
      - node -v
      - pnpm -v
  - id: bus.jetstream.setup
    env: [NATS_URL]
    run:
      - npx ts-node scripts/js-setup.ts
    verify:
      - echo "JetStream ready"
  - id: deps.wave2
    run:
      - pnpm install
  - id: rag.api
    run:
      - npx ts-node scripts/rag-api.ts
    verify:
      - curl -f http://localhost:4010/health || echo "API not responding"
  - id: rag.index.demo
    run:
      - npx ts-node scripts/rag-index.ts docs
  - id: rag.query.demo
    run:
      - npx ts-node scripts/rag-query.ts "What is Mandala?"
  - id: dataset.api
    run:
      - npx ts-node scripts/dataset-api.ts
    verify:
      - curl -f http://localhost:3000/datasets || echo "API not responding"
  - id: rag.cite.demo
    run:
      - npx ts-node scripts/rag-cite-demo.ts "What is Mandala?"
  - id: k8s.apply.base
    run:
      - kubectl apply -f deployment
  - id: realtime.hub
    run:
      - npx ts-node scripts/realtime-hub.ts
    verify:
      - curl -f http://localhost:4020/live/ask -H 'Content-Type: application/json' -d '{"question":"ping"}' || echo "API not responding"
  - id: annotations.api
    run:
      - npx ts-node scripts/annotations-api.ts
    verify:
      - curl -f http://localhost:3002/annotations/test || echo "API not responding"
  - id: share.api
    run:
      - npx ts-node scripts/share-api.ts
    verify:
      - curl -f "http://localhost:3000/verify?url=http://example.com" || echo "API not responding"
  - id: win.tools.build
    run:
      - pwsh tools/windows/build-windows-tools.ps1
  - id: voice.os.api
    run:
      - npx ts-node scripts/voice-os-control-api.ts
    verify:
      - curl -f http://localhost:5050/stt -H 'Content-Type: application/json' -d '{}' || echo "API not responding"
  - id: uia.demo
    run:
      - npx ts-node scripts/os-bridge-api.ts
    verify:
      - curl -f http://localhost:3030/clipboard || echo "API not responding"
  - id: admin.api
    run:
      - npx ts-node scripts/admin-api.ts
    verify:
      - curl -f http://localhost:4010/status || echo "API not responding"
  - id: admin.peers.api
    run:
      - npx ts-node scripts/admin-peers-api.ts
    verify:
      - curl -f http://localhost:4011/peers || echo "API not responding"
  - id: commons.api
    run:
      - npx ts-node scripts/commons-api.ts
    verify:
      - curl -f -X POST http://localhost:4000/spaces -H 'Content-Type: application/json' -d '{"name":"test"}' || echo "API not responding"
  - id: commons.presence.ws
    run:
      - npx ts-node scripts/commons-presence-ws.ts
    verify:
      - node -e "const WebSocket=require('ws'); const ws=new WebSocket('ws://localhost:4050/?spaceId=test'); ws.on('open',()=>process.exit(0)); setTimeout(()=>process.exit(1),1000);" || echo "WS not responding"
