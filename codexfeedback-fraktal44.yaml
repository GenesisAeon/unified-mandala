sigillin_validator:
  command: pnpm validate:sigillins
  schema: scripts/sigillin/mandala-sigillin.schema.json
  script: scripts/sigillin/validate-sigillins.ts
  workflow: .github/workflows/sigillin-validate.yml
  checks:
    structural:
      - JSON/YAML Schema (id/title/essenz/content Pflichtfelder)
      - Link-Existenzprüfung für relative Pfade
    content:
      - CREP Bezug
      - Trikāya Bezug
      - Next Action Hinweis
  documentation:
    - docs/roadmap/v1.0-stabilization-playbook.md (Sigillin Governance Abschnitt)
    - README.md (Script Übersicht)
ci_release:
  fail_fast: true
  nightly_alerts: true
  coverage: vitest + pytest Reports überwacht (ci.nightly.yml)
  release_drill:
    steps:
      - pnpm build
      - pnpm dev:services (dist server) / pnpm start:light
      - pnpm smoke:light-static
      - docker compose --profile prod up (inkl. monitoring)
    result: green
    notes: Alerts für Prometheus/Grafana hinterlegt, Health-Endpoints geprüft.
dev_scripts:
  updates:
    pnpm dev: cross-env UI_DIST=http://localhost:5173 pnpm -F mandala-ui dev
    pnpm dev:services: tsx scripts/dev-server.ts
    pnpm dev:stack: node scripts/dev-services.mjs --mode=dev
  documentation:
    - README.md
    - CONTRIBUTING.md
    - analysis/scripts-and-commands.json
