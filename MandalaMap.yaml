  - path: .github/
    category: ci-infra
    status: active
    title: GitHub workflows & templates
    description: Workflow definitions (core, nightly, experimental) and community health
      files.
    notes:
      - Audit instructions encoded as jobs; isolate non-actionable tasks to stop false
        CI failures.
      - Core/extended workflows documented in docs/roadmap/v1.0-stabilization-playbook.md.
      - Sigillin validator is required on main; mandala-map workflow uploads artifacts
        without blocking CI.
      - Repo Sanity builds the UI dist and waits on apps/ui/dist/index.html before running
        map/audit checks to avoid race conditions.
      - CI-Core startet einen Docker-basierten NATS-Server und ruft `pnpm nats:doctor`
        sowie `pnpm test:jetstream` im type-and-tests-Gate auf (Fraktal57).
      - CI-Core erzeugt Coverage via `pnpm test:unit:coverage` und publiziert das Artefakt
        `coverage-vitest`.
      - '`policy-check.yml` lädt Sigillin-Governance-Berichte als separates GitHub-Artefakt
        `policy-sigillins`.'
      - Python-Jobs installieren zusätzlich `src/adapters/requirements.txt`, sodass NetCDF4/h5netcdf/scipy
        offline verfügbar sind; `PANTHEON_DISABLE=1` hält QA-Analytics in CI ausgeschaltet.
      - Governance-Workflow ruft `pnpm schema:validate`, `pnpm maps:validate` und `pnpm
        policy:check` mit deaktivierten Analytics auf; Repo-Sanity prüft `ciBehaviour`-Felder
        via `pnpm sanity` (Fraktal65).
      - 'Fraktal66: Policy-Suite markiert Kyverno/Sigillin als optionale Schritte, loggt
        Skip-Warnungen wenn Kyverno-CLI oder `sigillins:report` fehlen und setzt `PANTHEON_DISABLE=1`;
        repomap-Fallback erzeugt Artefakte, falls `scripts/run-dist.mjs` nicht verfügbar
        ist.'
      - 'Fraktal76 führt `ai-commit-guard.yml` ein: blockiert Bot-Pushes auf main, verhindert
        `.ai-scratch/`-Artefakte und erinnert im PR-Template an das Two-Plane-Modell (repo://
        read-only ↔ scratch:// runtime).'
      - 'Fraktal77 ergänzt `status-gate.yml`: Das Label **ready-to-merge** löst einen
        Gate-Lauf (Draft, ReviewDecision, Mergeability, Status-Rollup) aus und aktiviert
        Auto-/Merge-Queue bei Erfolg.'
      - 'Fraktal77 ergänzt `auto-provenance.yml`: vergibt automatisch `source:*` Labels
        (human, human-docs, mandala-ai, external-ai).'
      - '`provenance-gate.yml` prüft Pfad-/Plane-Matrix, schützt packages/**/core, Guard-Skripte
        sowie Deploy-/Infra-Verzeichnisse.'
      - '`on-demand.yml` aktiviert Slash-Commands (`/run repomap`, `/run governance`)
        und hängt Labels `run:repomap`/`ci:advisory` an.'
      - 'Fraktal78: `ci.core.yml` bündelt Coverage (`pnpm test:unit:coverage`) und Governance-Gates
        (`pnpm schema:validate`, `pnpm maps:validate`, `pnpm sanity`, `pnpm policy:check`)
        als Pflichtlauf; Artefakt `coverage-vitest` wird hochgeladen, Label `ci:advisory`
        triggert `pnpm check:ci` als Soft-Fail.'
      - '`ci.runtime.yml` startet NATS + AI-Smoketest, ausgelöst durch Label `ci:runtime`.'
      - 'Fraktal87 ergänzt `.github/workflows/ci.qwen-smoke.yml` als Self-Hosted-Lane (Label `ci:qwen-smoke`, optional
        `workflow_dispatch`) für den Qwen-Smoke (`pnpm smoke:qwen`); verweist auf `RoleOutCommands.*` und den Pre-Push-Hook
        `pnpm hook:qwen-smoke`.'
    links:
      - label: CI Core
        path: .github/workflows/ci.core.yml
      - label: Nightly Mirror
        path: .github/workflows/ci.nightly.yml
      - label: Sigillin validate
        path: .github/workflows/sigillin-validate.yml
