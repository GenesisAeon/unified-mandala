    category: automation
    status: active
    title: Automation scripts
    description: 'Extensive Node/TS automation: dev servers, exports, QA, smoke tests,
      repo map, etc.'
    notes:
      - Dist-first convention via scripts/run-dist.mjs; referenced throughout docs.
      - Sigillin-Fix-CLI (scripts/fix-sigillin.ts) unterstützt Bridges bei Trikāya/CREP/Nächste-Schritt-Korrekturen.
      - Windows-Parität über scripts/setup-dev-env.ps1 + scripts/run-powershell.mjs dokumentiert
        (PowerShell-Fallback).
      - PowerShell-Setup exportiert Installationsstatus nach out/setup/install-state.json
        für Codexfeedback-Reports.; Corepack-Admin-Check vermeidet EPERM, bietet Benutzeraktivierung
        ohne Admin-Rechte und ergänzt NATS-Installationshinweise für `pnpm start:all`.
      - 'ParserFix: (Test-CommandExists ...) jetzt geklammert und Installationsresultate
        werden zu Bool gecastet, damit PowerShell 7.5 den Dev-Setup ohne ParserError ausführt.'
      - Emergence-Breath (scripts/emergence-breath.mjs) koppelt pnpm dev:breath an validate:sigillins
        + trikaya:dashboard und meldet Coverage-Metriken nach jedem Lauf.
      - 'Dev-Stack prüft Ports automatisch, räumt Standard-Ports via `pnpm dlx kill-port`
        auf (Opt-out: `UM_DEV_SERVICES_AUTOFREE_PORTS=0`) und verweist bei Bedarf auf
        `pnpm dev:ports:free`.'
      - '`scripts/nats-doctor.mjs` liefert JetStream-Hinweise (fehlendes `-js`, Timeout,
        Berechtigungen) und `scripts/nats-docker.mjs` startet bzw. überwacht JetStream-Container
        für lokale Tests.'
      - Git-Hook-Validator (`scripts/sigillins-validate-changed.mjs`) prüft nur geänderte
        Bridges vor dem Commit.
      - Governance-Reports (`scripts/sigillins-generate-reports.mjs`) erzeugen JUnit-XML
        und Markdown für Policy-Auswertungen; `pnpm policy:check` schreibt die Artefakte
        automatisch nach `out/policy/sigillins/`.
      - '`scripts/lib/python.mjs` setzt `PYTHONPATH` wieder auf das Repo-Wurzel- `src`,
        sodass Adapter-Builds ohne manuelle Overrides laufen.'
      - QA-Test-Runner lädt Pantheon Analytics nur bei Bedarf und respektiert `PANTHEON_DISABLE`,
        damit CI ohne zusätzliche Artefakte bleibt.
      - Fraktal70 ergänzt `scripts/realtime/sub-cosmic.mjs` als NATS-Subscriber (Alias
        `pnpm sub:cosmic`, Standard-Subject `demo.cosmic`, Multi-Server & Queue-Option),
        um Cosmic-Web-Ticks lokal zu prüfen und erinnert daran, dass Port 4222 ein TCP-Endpunkt
        ist.
      - Fraktal73 erkennt Docker-`nats`-Container im Windows-Setup (`scripts/setup-dev-env.ps1`),
        exportiert Status & Start-Hinweise und behandelt laufende Container als erfüllt.
      - Fraktal76 ergänzt `scripts/ci/ai-commit-guard.mjs`, das Bot-Pushes auf `main`
        blockt und `.ai-scratch/`-Artefakte stoppt; Agenten speichern Runtime-Dateien
        dadurch konsequent unter `scratch://` oder `data://`.
      - Fraktal79 liefert `scripts/start-cosmic-web.mjs` als One-Command-Orchestrator
        (NATS, Artefakte, Services, UI, Smoke) und `scripts/ci/no-local-path-leaks.mjs`
        verhindert versehentliche Windows-Pfade oder Secrets im Staging-Bereich.
      - Fraktal86 exportiert im Dev-Helper (`scripts/dev-helper.ps1`) eine Port-Matrix (share/experiments/rag/flags/api/health/realtime) inkl. Offset; `config/ports.ts` und `apps/ui/vite.config.ts` interpretieren Env-Overrides als absolute Ports, `scripts/dev-services.mjs` prüft Konflikte ohne Doppel-Offsets und der Health-Aggregator nutzt dynamische Portwerte.
      - >-
        Fraktal87 startet den Qwen-Rollout: `scripts/smoke/qwen-smoke.mjs` liefert `pnpm smoke:qwen`, der Pre-Push-Trigger
        `scripts/hooks/qwen-smoke-trigger.mjs` (`pnpm hook:qwen-smoke`) läuft nur bei `AI_PROVIDER=qwen-*`/`UM_RUN_QWEN_SMOKE=1`;
        `.github/workflows/ci.qwen-smoke.yml` und `docs/roadmap/RoleOutCommands.(md|json|yaml)` spiegeln denselben Flow.
