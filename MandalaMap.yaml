    active: Maintained and in current use; expect ongoing iteration.
    experimental: Prototype or research area; coverage may be partial.
    in-progress: Partially implemented; additional engineering required.
    stub: Placeholder or type stub awaiting production implementation.
    generated: Derived artifacts or caches regenerated by scripts.
    backlog: Planning/backlog data to feed repositorypflege automation.
    system: Infrastructure-managed assets (no manual editing).
