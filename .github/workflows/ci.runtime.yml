name: ci.runtime

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  e2e_runtime:
    name: Runtime E2E
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci:runtime') }}
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:latest
        ports:
          - 4222:4222
          - 8222:8222
        options: --name nats-ci
    steps:
      - uses: actions/checkout@v4
      - name: Build API workspace
        uses: ./.github/actions/run-pnpm-task
        with:
          task: '--filter @unified-mandala/api build'
      - name: NATS doctor
        uses: ./.github/actions/run-pnpm-task
        with:
          task: nats:doctor
          install: 'false'
      - name: JetStream tests
        uses: ./.github/actions/run-pnpm-task
        with:
          task: test:jetstream
          install: 'false'
