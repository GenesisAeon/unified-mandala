name: ci.runtime

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  runtime_e2e:
    name: Runtime / NATS E2E
    if: >-
      ${{ contains(github.event.pull_request.labels.*.name, 'ci:runtime') }}
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:latest
        ports:
          - 4222:4222
          - 8222:8222
        options: --name nats-ci
    steps:
      - uses: actions/checkout@v4
      - name: Build API
        uses: ./.github/actions/run-pnpm-task
        with:
          task: -F @unified-mandala/api build
      - name: AI smoke
        uses: ./.github/actions/run-pnpm-task
        with:
          task: ai:smoke
