name: MandalaMap (strict on label)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  validate-strict:
    if: contains(toJson(github.event.pull_request.labels.*.name), 'mandalamap:strict')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Run maps:sync (strict = fail on warnings)
        run: |
          set -eo pipefail
          mkdir -p out/ci
          pnpm maps:sync 2>&1 | tee out/ci/mandala-map.log
          if grep -Ei '(warn|warning)' out/ci/mandala-map.log; then
            echo "::error::Warnings detected in mandala-map validation (strict mode)."
            exit 1
          fi

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandalamap-strict-logs
          path: out/ci/mandala-map.log
          if-no-files-found: warn
