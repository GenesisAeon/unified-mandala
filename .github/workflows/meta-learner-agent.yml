name: MetaLearnerAgent
on:
  schedule:
    - cron: '0 6 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
            - run: pnpm install
      - run: pnpm ts-node packages/agents/MetaLearnerAgent.ts
