name: ci.core

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  decide:
    name: Detect changes and CI level
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.level.outputs.level }}
      docs_changed: ${{ steps.filter.outputs.docs }}
      maps_changed: ${{ steps.filter.outputs.maps }}
      code_changed: ${{ steps.filter.outputs.code }}
      labels: ${{ steps.labels.outputs.names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          filters: |
            docs:
              - 'docs/**'
              - '**/*.md'
              - '**/*.mdx'
              - 'codexfeedback*'
              - 'MandalaMap.*'
            maps:
              - 'docs/maps/**'
              - 'MandalaMap.*'
            code:
              - '.github/**'
              - 'apps/**'
              - 'packages/**'
              - 'services/**'
              - 'scripts/**'
              - 'src/**'
              - 'ci/**'
              - 'cypress/**'
              - 'integration/**'
              - 'orchestrator/**'
              - 'unifiedmandala-*/**'
              - 'pipelines/**'
              - 'tests/**'
              - 'tools/**'
              - '!**/*.md'
              - '!docs/**'
      - id: labels
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          with open(os.environ.get('GITHUB_EVENT_PATH', ''), 'r', encoding='utf-8') as fh:
              data = json.load(fh)
          labels = [label['name'] for label in data.get('pull_request', {}).get('labels', [])]
          print(f"names={json.dumps(labels)}")
          PY
      - id: level
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          with open(os.environ.get('GITHUB_EVENT_PATH', ''), 'r', encoding='utf-8') as fh:
              data = json.load(fh)
          labels = {label['name'] for label in data.get('pull_request', {}).get('labels', [])}
          level = 'core'
          if 'ci:extended' in labels:
              level = 'extended'
          if 'ci:runtime' in labels:
              level = 'runtime'
          print(f'level={level}')
          PY

  type_and_tests:
    name: Type, lint, build & coverage gate
    runs-on: ubuntu-latest
    needs: [decide]
    if: >-
      ${{
        github.event_name == 'push' ||
        needs.decide.outputs.code_changed == 'true' ||
        needs.decide.outputs.docs_changed == 'true' ||
        contains(fromJSON(needs.decide.outputs.labels), 'ci:extended')
      }}
    env:
      OFFLINE: '1'
      LOW_MEM: '1'
      VITE_LOW_MEM: 'on'
      NODE_OPTIONS: '--max-old-space-size=2048'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck
        uses: ./.github/actions/run-pnpm-task
        with:
          task: typecheck
      - name: Lint
        uses: ./.github/actions/run-pnpm-task
        with:
          task: lint:eslint
      - name: Format check
        uses: ./.github/actions/run-pnpm-task
        with:
          task: lint:format
      - name: Build API workspace
        uses: ./.github/actions/run-pnpm-task
        with:
          task: -F @unified-mandala/api build
      - name: Unit tests with coverage
        uses: ./.github/actions/run-pnpm-task
        with:
          task: test:unit:coverage
      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-vitest
          path: |
            coverage
            coverage-final.json
          if-no-files-found: ignore
      - name: Schema validation
        uses: ./.github/actions/run-pnpm-task
        with:
          task: schema:validate
      - name: Map validation
        uses: ./.github/actions/run-pnpm-task
        with:
          task: maps:validate
      - name: Repository sanity
        uses: ./.github/actions/run-pnpm-task
        with:
          task: sanity
      - name: Policy suite
        uses: ./.github/actions/run-pnpm-task
        with:
          task: policy:check

  opa_policy:
    name: OPA Policy & Coverage
    runs-on: ubuntu-latest
    needs: [decide]
    timeout-minutes: 15
    if: >-
      ${{
        github.event_name == 'push' ||
        needs.decide.outputs.code_changed == 'true' ||
        needs.decide.outputs.docs_changed == 'true' ||
        contains(fromJSON(needs.decide.outputs.labels), 'ci:extended')
      }}
    env:
      OPA_COVER_MIN: ${{ github.ref == 'refs/heads/main' && '0.90' || '0.85' }}
      OPA_COVER_TOP: '5'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: corepack enable

      - run: pnpm i --frozen-lockfile

      - name: OPA tests + coverage gate
        run: |
          pnpm -w opa:fmt
          pnpm -w opa:lint
          pnpm -w ci:opa:cover

      - name: Upload OPA coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-coverage
          path: dist/opa/coverage.json
          if-no-files-found: warn

      - name: Attach summary links
        if: always()
        run: |
          echo "OPA coverage report saved as artifact **opa-coverage**." >> "$GITHUB_STEP_SUMMARY"

  ai_commit_guard:
    name: AI commit guard
    runs-on: ubuntu-latest
    needs: [decide]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard runtime vs repo writes
        run: node scripts/ci/ai-commit-guard.mjs

  advisory_suite:
    name: Advisory suite (soft fail)
    runs-on: ubuntu-latest
    needs: [decide]
    if: >-
      ${{
        github.event_name == 'push' ||
        contains(fromJSON(needs.decide.outputs.labels), 'ci:advisory')
      }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Advisory bundle (check:ci)
        uses: ./.github/actions/run-pnpm-task
        with:
          task: check:ci

  repomap_when_needed:
    name: Repomap (on demand)
    runs-on: ubuntu-latest
    needs: [decide]
    if: >-
      ${{
        needs.decide.outputs.maps_changed == 'true' ||
        contains(fromJSON(needs.decide.outputs.labels), 'run:repomap') ||
        contains(fromJSON(needs.decide.outputs.labels), 'ci:extended')
      }}
    steps:
      - uses: actions/checkout@v4
      - name: Build repomap
        uses: ./.github/actions/run-pnpm-task
        with:
          task: repomap:build
      - name: Validate repomap
        uses: ./.github/actions/run-pnpm-task
        with:
          task: repomap:validate
