name: CI Core
on:
  pull_request:
  push:
    branches: [main]
jobs:
  type-and-tests:
    runs-on: ubuntu-latest
    env:
      OFFLINE: '1'
      LOW_MEM: '1'
      VITE_LOW_MEM: 'on'
      NODE_OPTIONS: '--max-old-space-size=2048'
      CI: 'true'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - name: Debug toolchain versions
        run: |
          echo "Node $(node -v)"
          echo "PNPM v$(pnpm -v)"
          python --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Capture toolchain manifest
        run: |
          {
            echo "Node $(node -v)"
            echo "PNPM v$(pnpm -v)"
            echo "Python $(python --version 2>&1)"
          } > toolchain-versions.txt
      - name: Start NATS JetStream (Docker)
        run: |
          docker rm -f nats-jetstream 2>/dev/null || true
          docker run -d --name nats-jetstream -p 4222:4222 nats:2.10-alpine -js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-versions
          path: toolchain-versions.txt
      - run: npx tsc -p tsconfig.json --noEmit
      - run: pnpm nats:doctor
      - run: pnpm test:ts:ci
      - run: pnpm test:jetstream
      - name: Run Vitest coverage
        run: |
          rm -rf coverage
          pnpm test:unit
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-vitest
          path: coverage/
          if-no-files-found: ignore
      - run: pnpm test:py
      - run: npx pyright
