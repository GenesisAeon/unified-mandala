name: ci.core

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  decide:
    name: Decide CI level
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.level.outputs.level }}
      docs_changed: ${{ steps.filter.outputs.docs }}
      maps_changed: ${{ steps.filter.outputs.maps }}
      code_changed: ${{ steps.filter.outputs.code }}
      labels: ${{ steps.labels.outputs.names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - '**/*.md'
            maps:
              - 'docs/maps/**'
              - 'MandalaMap.*'
            code:
              - 'packages/**'
              - 'apps/**'
              - 'src/**'
              - 'services/**'
              - 'scripts/**'
              - '!**/*.md'
      - id: labels
        name: Collect labels
        shell: bash
        run: |
          LABELS=$(jq -r 'if has("pull_request") then (.pull_request.labels // [] | map(.name)) else [] end | @json' "$GITHUB_EVENT_PATH")
          echo "names=$LABELS" >> "$GITHUB_OUTPUT"
      - id: level
        name: Decide level
        shell: bash
        run: |
          LEVEL=$(jq -r '
            def has_label($name): if has("pull_request") then (.pull_request.labels // [] | map(.name) | index($name) != null) else false end;
            if has_label("ci:runtime") then "runtime"
            elif has_label("ci:extended") then "extended"
            elif has_label("ci:advisory") then "advisory"
            else "core" end
          ' "$GITHUB_EVENT_PATH")
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

  type_and_tests:
    name: Type + unit + build
    runs-on: ubuntu-latest
    needs: decide
    if: ${{ needs.decide.outputs.code_changed == 'true' || github.event_name == 'push' || contains(fromJSON(needs.decide.outputs.labels), 'ci:extended') }}
    env:
      CI: 'true'
      NODE_OPTIONS: '--max-old-space-size=2048'
      PANTHEON_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck
        uses: ./.github/actions/run-pnpm-task
        with:
          task: typecheck
      - name: ESLint
        uses: ./.github/actions/run-pnpm-task
        with:
          task: lint:eslint
          install: 'false'
      - name: Build API package
        uses: ./.github/actions/run-pnpm-task
        with:
          task: '--filter @unified-mandala/api build'
          install: 'false'
      - name: Unit tests
        uses: ./.github/actions/run-pnpm-task
        with:
          task: test:unit
          install: 'false'
      - name: Pyright
        run: npx pyright

  ai_commit_guard:
    name: AI commit guard
    runs-on: ubuntu-latest
    needs: decide
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard bot commits
        run: node scripts/ci/ai-commit-guard.mjs

  advisory_suite:
    name: Advisory suite
    runs-on: ubuntu-latest
    needs: decide
    if: ${{ contains(fromJSON(needs.decide.outputs.labels), 'ci:advisory') || github.event_name == 'push' || contains(fromJSON(needs.decide.outputs.labels), 'ci:extended') }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Repo sanity
        uses: ./.github/actions/run-pnpm-task
        with:
          task: sanity
      - name: Policy check
        uses: ./.github/actions/run-pnpm-task
        with:
          task: policy:check
          install: 'false'
      - name: Governance schemas
        uses: ./.github/actions/run-pnpm-task
        with:
          task: schema:validate
          install: 'false'
      - name: Maps validate
        uses: ./.github/actions/run-pnpm-task
        with:
          task: maps:validate
          install: 'false'
      - name: Repomap (advisory)
        uses: ./.github/actions/run-pnpm-task
        with:
          task: repomap:validate
          install: 'false'

  repomap_when_relevant:
    name: Repomap on change
    runs-on: ubuntu-latest
    needs: decide
    if: ${{ needs.decide.outputs.maps_changed == 'true' || contains(fromJSON(needs.decide.outputs.labels), 'run:repomap') || contains(fromJSON(needs.decide.outputs.labels), 'ci:extended') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build repomap
        uses: ./.github/actions/run-pnpm-task
        with:
          task: repomap:build
      - name: Validate repomap
        uses: ./.github/actions/run-pnpm-task
        with:
          task: repomap:validate
          install: 'false'
