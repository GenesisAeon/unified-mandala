name: CI Core / type-and-tests

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  type-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.16.1 --activate
      - name: Toolchain diag
        run: |
          node -v
          pnpm -v
          python3 --version || true
          echo "CI=$CI OFFLINE=$OFFLINE LOW_MEM=$LOW_MEM VITE_LOW_MEM=$VITE_LOW_MEM"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        env:
          OFFLINE: "1"
          LOW_MEM: "1"
          VITE_LOW_MEM: "on"
          PYTHONPATH: src
          CI: "true"
        run: pnpm typecheck
      - name: Vitest (Core filtered)
        env:
          OFFLINE: "1"
          LOW_MEM: "1"
          VITE_LOW_MEM: "on"
          PYTHONPATH: src
          CI: "true"
        run: pnpm test:ts:ci
      - name: Pyright
        run: npx pyright
