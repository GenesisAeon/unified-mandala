name: status-gate

on:
  pull_request:
    types: [labeled, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull Request number
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: status-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ready-to-merge')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Compute PR number
        id: pr
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "number=${{ github.event.inputs.pr }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch PR state via GraphQL
        id: gql
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          OWNER="${REPOSITORY%%/*}"
          REPO="${REPOSITORY##*/}"
          q='
          query($owner:String!, $repo:String!, $pr:Int!) {
            repository(owner:$owner, name:$repo) {
              pullRequest(number:$pr) {
                number
                isDraft
                reviewDecision
                mergeable
                headRefName
                baseRefName
                commits(last:1) {
                  nodes {
                    commit {
                      oid
                      statusCheckRollup {
                        state
                        contexts(first:200) {
                          nodes {
                            __typename
                            ... on CheckRun { name conclusion status }
                            ... on StatusContext { context state }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }'
          resp=$(gh api graphql -f owner="$OWNER" -f repo="$REPO" -F pr="$PR" -f query="$q")
          echo "$resp" > resp.json
          echo "state=$(jq -r '.data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.state' resp.json)" >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -r '.data.repository.pullRequest.isDraft' resp.json)" >> "$GITHUB_OUTPUT"
          echo "review=$(jq -r '.data.repository.pullRequest.reviewDecision' resp.json)" >> "$GITHUB_OUTPUT"
          echo "mergeable=$(jq -r '.data.repository.pullRequest.mergeable' resp.json)" >> "$GITHUB_OUTPUT"

      - name: Gate conditions
        id: gate
        run: |
          echo "Rollup:       ${{ steps.gql.outputs.state }}"
          echo "Draft:        ${{ steps.gql.outputs.draft }}"
          echo "Review:       ${{ steps.gql.outputs.review }}"
          echo "Mergeable:    ${{ steps.gql.outputs.mergeable }}"

          if [[ "${{ steps.gql.outputs.draft }}" == "true" ]]; then
            echo "❌ PR ist noch Draft."
            exit 1
          fi
          if [[ "${{ steps.gql.outputs.review }}" != "APPROVED" ]]; then
            echo "❌ ReviewDecision ist nicht APPROVED."
            exit 1
          fi
          if [[ "${{ steps.gql.outputs.mergeable }}" != "MERGEABLE" ]]; then
            echo "❌ PR ist nicht MERGEABLE (Konflikte/unknown)."
            exit 1
          fi
          if [[ "${{ steps.gql.outputs.state }}" != "SUCCESS" ]]; then
            echo "❌ Checks sind nicht vollständig SUCCESS."
            exit 1
          fi

          echo "✅ Alle Gates erfüllt."

      - name: Enable auto-merge (queues when Merge Queue is required)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.pr.outputs.number }} --squash --auto --delete-branch
          echo "🟢 Auto-Merge aktiviert (bei aktivierter Merge Queue wird der PR eingereiht)."

      - name: Remove label if gate failed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ steps.pr.outputs.number }} --remove-label "ready-to-merge" || true
