name: ci.qwen-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

jobs:
  qwen_smoke:
    name: Qwen local smoke
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          contains(github.event.pull_request.labels.*.name, 'ci:qwen-smoke') }}
    runs-on:
      - self-hosted
      - qwen
    env:
      AI_PROVIDER: qwen-ollama
      QWEN_ENDPOINT: http://localhost:11434
      QWEN_MODEL: qwen2.5:7b-instruct
      UI_DEV_URL: http://localhost:5173
      API_BASE: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Run Qwen smoke
        shell: bash
        run: pnpm smoke:qwen
