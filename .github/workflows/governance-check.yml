name: Governance & Schema
on: [pull_request, push]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i ajv
      - run: node tools/schema-validate.mjs
      - run: node tools/governance-check.mjs
