name: CI Experimental
on:
  pull_request:
    types: [labeled, synchronize]
jobs:
  agents-and-governance:
    if: contains(github.event.pull_request.labels.*.name, 'run-experimental')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - run: pnpm install --frozen-lockfile
      - name: Debug toolchain versions
        run: |
          echo "Node $(node -v)"
          echo "PNPM v$(pnpm -v)"
      - name: Agents health sweep
        shell: bash
        run: |
          set -o pipefail
          pnpm run agents:health | tee agents-dry-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agents-dry-run-logs
          path: agents-dry-run.log
  kyverno-guardrails:
    if: contains(github.event.pull_request.labels.*.name, 'run-experimental')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - run: pnpm install --frozen-lockfile
      - name: Debug toolchain versions
        run: |
          echo "Node $(node -v)"
          echo "PNPM v$(pnpm -v)"
      - name: Run policy suite
        id: policy_suite
        shell: bash
        run: |
          set +e
          pnpm policy:check
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "POLICY_SUITE_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Render policy report
        if: always()
        run: node scripts/render-policy-suite-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-suite-report
          path: out/policy/
          if-no-files-found: ignore
      - name: Fail on policy suite result
        if: always()
        run: |
          if [ "${{ steps.policy_suite.outputs.status }}" != "0" ]; then
            echo "::error::Policy suite failed with exit code ${{ steps.policy_suite.outputs.status }}"
            exit 1
          fi
