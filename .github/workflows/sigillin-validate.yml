name: sigillin-validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sigillin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.16.1 --activate

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Validate Sigillins
        run: pnpm validate:sigillins
