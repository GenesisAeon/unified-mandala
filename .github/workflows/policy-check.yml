name: Policy Checks
on: [push, pull_request]
jobs:
  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: OPA policy check
        run: |
          node tools/opa-check.mjs fixtures/events/example_input.json
  kyverno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kyverno validate (dry-run)
        uses: kyverno/action@v0.4.0
        with:
          policies: policies/kyverno.yaml
          resources: fixtures/events/example_input.json
          cluster: false
        continue-on-error: true
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Governance guardrails
        run: pnpm guardrails:check
        continue-on-error: true
