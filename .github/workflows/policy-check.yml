name: Policy Checks
on: [push, pull_request]

jobs:
  policy-suite:
    name: Consolidated policy suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run policy suite
        run: pnpm policy:check -- --report out/policy-report.json
      - name: Upload policy report
        uses: actions/upload-artifact@v4
        with:
          name: policy-report
          path: out/policy-report.json
