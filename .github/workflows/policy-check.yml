name: Policy Checks
on: [push, pull_request]
jobs:
  policy-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run policy suite (OPA & Guardrails)
        id: suite
        run: pnpm policy:check
        continue-on-error: true
      - name: Kyverno dry-run
        id: kyverno
        shell: bash
        run: |
          KYVERNO_VERSION=1.12.6
          curl -sLO "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno_linux_amd64.tar.gz"
          tar -xzf kyverno_linux_amd64.tar.gz kyverno
          ./kyverno apply policies/kyverno.yaml --resource fixtures/events/example_input.json || true
        continue-on-error: true
      - name: Render policy summary
        id: render
        if: always()
        run: node scripts/render-policy-suite-report.mjs
        env:
          KYVERNO_CONCLUSION: ${{ steps.kyverno.conclusion }}
          KYVERNO_OUTCOME: ${{ steps.kyverno.outcome }}
      - name: Upload policy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-suite-report
          path: out/policy/
          if-no-files-found: ignore
      - name: Upload sigillin governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-sigillins
          path: out/policy/sigillins/
          if-no-files-found: ignore
      - name: Fail on policy violations
        if: always()
        run: |
          status=$(cat out/policy/policy-suite-status.txt 2>/dev/null || echo "missing")
          if [ "$status" != "passed" ]; then
            echo "::error::Policy suite reported failures (${status})."
            exit 1
          fi
          echo "Policy suite passed."
