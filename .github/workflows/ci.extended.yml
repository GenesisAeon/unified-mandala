name: CI Extended
on:
  schedule:
    - cron: '0 2 * * *'
  pull_request:
    types: [labeled, synchronize]
jobs:
  extended-tests:
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-extended')
    runs-on: ubuntu-latest
    env:
      OFFLINE: '1'
      LOW_MEM: '1'
      VITE_LOW_MEM: 'on'
      PANTHEON_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - run: pnpm install --frozen-lockfile
      - name: Debug toolchain versions
        run: |
          echo "Node $(node -v)"
          echo "PNPM v$(pnpm -v)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r src/adapters/requirements.txt
      - run: pnpm test:ts:extended
      - run: pnpm test:py:extended
  adapters-offline:
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-extended')
    runs-on: ubuntu-latest
    env:
      OFFLINE: '1'
      LOW_MEM: '1'
      PYTHONPATH: src
      PANTHEON_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - run: pnpm install --frozen-lockfile
      - name: Debug toolchain versions
        run: |
          echo "Node $(node -v)"
          echo "PNPM v$(pnpm -v)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r src/adapters/requirements.txt
      - run: PYTHONPATH=src pnpm adapter:build:oisst
      - run: PYTHONPATH=src pnpm adapter:build:era5
      - name: Smoke adapters_index.json
        run: |
          test -f out/adapters_index.json
          jq -e '.adapters[] | select(.id | test("oisst|era5";"i"))' out/adapters_index.json >/dev/null
  stac-resonance:
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-extended')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - run: pnpm install --frozen-lockfile
      - name: Debug toolchain versions
        run: |
          echo "Node $(node -v)"
          echo "PNPM v$(pnpm -v)"
      - run: pnpm stac:validate
      - run: pnpm resonance:calc

  coverage:
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-extended')
    runs-on: ubuntu-latest
    env:
      OFFLINE: '1'
      LOW_MEM: '1'
      VITE_LOW_MEM: 'on'
      PANTHEON_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - run: pnpm install --frozen-lockfile
      - name: Debug toolchain versions
        run: |
          echo "Node $(node -v)"
          echo "PNPM v$(pnpm -v)"
      - run: pnpm test:unit:coverage
