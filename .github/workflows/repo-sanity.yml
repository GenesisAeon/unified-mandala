name: Repo Sanity
on: [push, pull_request]
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build repo map
        run: pnpm maps:build
      - name: Audit UI/VR consistency
        run: pnpm audit:ui-vr
        continue-on-error: true
      - name: Verify repo map output
        run: test -f analysis/repo-map.json
      - name: Capture UI/VR audit artifact status
        run: |
          if [ -f analysis/ui-vr-audit.json ]; then
            echo "UI-VR audit artifact present"
          else
            echo "UI-VR audit artifact missing (non-blocking)"
          fi
