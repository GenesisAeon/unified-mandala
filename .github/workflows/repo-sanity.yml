name: Repo Sanity
on: [push, pull_request]
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build UI dist
        run: pnpm build:ui
      - name: Wait for UI dist assets
        run: npx wait-on "file:apps/ui/dist/index.html"
      - name: Build repo map
        run: pnpm repomap:build
      - name: Validate repo map
        run: pnpm repomap:validate
      - name: Audit UI vs VR
        run: pnpm audit:ui-vr
        continue-on-error: true
      - name: Repo sanity assertions
        run: pnpm sanity
