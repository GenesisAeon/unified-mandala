name: Split Conversations

on:
  push:
    paths:
      - 'docs/sigils/conversations.json'
  workflow_dispatch:

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '18'
      - run: pnpm install
      - run: node scripts/split-conversations.js 100
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update conversation chunks'
          branch: ${{ github.ref }}
