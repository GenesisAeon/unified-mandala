name: Fraktalrun Import

on:
  push:
    paths:
      - 'advancedToDo.*'
      - 'advancedToDo/**'
      - 'advancedToDo_parts/**'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fraktalrun:import
