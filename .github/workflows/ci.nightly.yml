name: ci.nightly

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

jobs:
  extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanity suite
        uses: ./.github/actions/run-pnpm-task
        with:
          task: sanity
      - name: Extended adapters offline
        uses: ./.github/actions/run-pnpm-task
        with:
          task: adapters:offline
      - name: Coverage
        uses: ./.github/actions/run-pnpm-task
        with:
          task: test:unit:coverage
      - name: Repomap full
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --if-present repomap:build
          pnpm --if-present repomap:validate
      - name: Chaos drill – ethics fail-closed
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm dev:stack > devstack.log 2>&1 &
          stack_pid=$!
          cleanup() {
            if kill -0 "$stack_pid" 2>/dev/null; then
              kill "$stack_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          sleep 15
          pnpm chaos:ethics --scenario boundary-down --expect failclosed
      - name: Chaos drill – verify-gate DNS rebind
        uses: ./.github/actions/run-pnpm-task
        with:
          task: chaos:verify-dns-rebind
      - name: Chaos drill – verify-gate redirect loop
        uses: ./.github/actions/run-pnpm-task
        with:
          task: chaos:verify-redirect-loop
