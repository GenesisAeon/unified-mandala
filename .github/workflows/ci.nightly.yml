name: ci.nightly

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

jobs:
  extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanity suite
        uses: ./.github/actions/run-pnpm-task
        with:
          task: sanity
      - name: Extended adapters offline
        uses: ./.github/actions/run-pnpm-task
        with:
          task: adapters:offline
      - name: Coverage
        uses: ./.github/actions/run-pnpm-task
        with:
          task: test:unit:coverage
      - name: Repomap full
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --if-present repomap:build
          pnpm --if-present repomap:validate
