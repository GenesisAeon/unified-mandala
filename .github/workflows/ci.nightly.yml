name: ci.nightly

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

jobs:
  extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain sanity
        uses: ./.github/actions/run-pnpm-task
        with:
          task: sanity
      - name: Extended adapters offline
        uses: ./.github/actions/run-pnpm-task
        with:
          task: adapters:offline
          install: 'false'
      - name: Coverage
        uses: ./.github/actions/run-pnpm-task
        with:
          task: test:unit:coverage
          install: 'false'
      - name: Repomap full
        uses: ./.github/actions/run-pnpm-task
        with:
          task: repomap:build
          install: 'false'
      - name: Repomap validate
        uses: ./.github/actions/run-pnpm-task
        with:
          task: repomap:validate
          install: 'false'
