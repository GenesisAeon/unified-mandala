name: Nightly

on:
  schedule: [{ cron: '17 2 * * *' }]
  workflow_dispatch: {}

jobs:
  nightly-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRAFANA_BASE_URL: ${{ secrets.GRAFANA_BASE_URL }}
      VERIFY_GATE_DASH_UID: ${{ secrets.VERIFY_GATE_DASH_UID }}
      ETHICS_MINI_UID: ${{ secrets.ETHICS_MINI_UID }}
      OPA_COVERAGE_UID: ${{ secrets.OPA_COVERAGE_UID }}
      ALERTMANAGER_URL: ${{ secrets.ALERTMANAGER_URL }}
      ALERTMANAGER_TOKEN: ${{ secrets.ALERTMANAGER_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - name: Install
        run: |
          corepack enable
          pnpm i --frozen-lockfile

      - name: Chaos – DNS rebind
        run: pnpm -w chaos:verify-dns-rebind
      - name: Chaos – redirect loop
        run: pnpm -w chaos:verify-redirect-loop
      - name: Smoke – policy/coverage
        run: pnpm -w ci:opa:cover

      - name: Grafana links
        if: ${{ env.GRAFANA_BASE_URL != '' && env.VERIFY_GATE_DASH_UID != '' }}
        run: |
          {
            echo "### Grafana"
            echo "- Verify-Gate Network Safety: ${GRAFANA_BASE_URL}/d/${VERIFY_GATE_DASH_UID}?orgId=1&from=now-24h&to=now"
            if [ -n "${ETHICS_MINI_UID}" ]; then
              echo "- Verify-Gate Ethics Mini: ${GRAFANA_BASE_URL}/d/${ETHICS_MINI_UID}?orgId=1&from=now-24h&to=now"
            fi
            if [ -n "${OPA_COVERAGE_UID}" ]; then
              echo "- OPA Coverage: ${GRAFANA_BASE_URL}/d/${OPA_COVERAGE_UID}?orgId=1&from=now-7d&to=now"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alertmanager summary
        if: ${{ env.ALERTMANAGER_URL != '' && env.ALERTMANAGER_TOKEN != '' }}
        run: |
          set -e
          curl -fsSL -H "Authorization: Bearer ${ALERTMANAGER_TOKEN}" \
            "${ALERTMANAGER_URL%/}/api/v2/alerts" -o alerts.json || echo "[]" > alerts.json
          node -e "const fs=require('fs');let a=[];try{a=JSON.parse(fs.readFileSync('alerts.json','utf8'))}catch{};const by=(s)=>a.filter(x=>x.status?.state===s);const fmt=l=>l.map(x=>`- **${x.labels?.alertname||'alert'}** \`${x.labels?.severity||'n/a'}\` @ ${x.labels?.job||'job'} (${x.labels?.instance||'inst'})`).join('\n');let out='### Alertmanager\n';const act=by('active'), sup=by('suppressed');out+=`Active: ${act.length}  |  Silenced: ${sup.length}\n\n`;if(act.length) out+='#### Active (top 15)\n'+fmt(act.slice(0,15))+'\n';fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out);"

      - name: Slack (on failure)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node -e "fetch(process.env.SLACK_WEBHOOK_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:`❌ Nightly chaos failed for ${process.env.REPO} @ ${process.env.SHA}\nSee job summary for Alertmanager + Grafana links.`})})"
