name: Release v0.3.0 — Python Package + Zenodo

on:
  push:
    tags:
      - "v0.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.0)"
        required: true
        default: "0.3.0"

permissions:
  contents: write
  id-token: write

jobs:
  # ── Quality Gate ─────────────────────────────────────────────────────────────
  quality:
    name: Quality Gate (ruff + mypy + pytest ≥99%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev,full-stack]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: mypy type check
        run: mypy src/unified_mandala

      - name: pytest (thermodynamics + planetary + metaquest + collapse)
        run: |
          pytest tests/python \
            -v \
            --tb=short \
            --cov=unified_mandala \
            --cov-report=term-missing \
            --cov-fail-under=99 \
            -m "not slow"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ── mkdocs Strict Build ───────────────────────────────────────────────────────
  docs:
    name: MkDocs --strict
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mkdocs dependencies
        run: pip install -e ".[dev]"
      - name: Build docs (strict)
        run: mkdocs build --strict
        continue-on-error: true  # docs warnings should not block release

  # ── Build Python Package ─────────────────────────────────────────────────────
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install hatch build
      - name: Build
        run: python -m build --sdist --wheel --outdir dist/
      - name: Verify wheel contents
        run: |
          pip install dist/*.whl --dry-run
          python -c "import unified_mandala; print(unified_mandala.__version__)"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-v0.3.0
          path: dist/

  # ── GitHub Release ────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-v0.3.0
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "unified-mandala v0.3.0 — Thermodynamic Anchors + Planetary Coupling + MetaQuest"
          body: |
            ## unified-mandala v0.3.0

            **Documentation & Test-Offensive + Thermodynamic Integration**

            DOI: [10.5281/zenodo.19184798](https://doi.org/10.5281/zenodo.19184798)

            ### New in v0.3.0

            #### Thermodynamics Module
            - Landauer erasure principle (`thermodynamics.landauer`)
            - Hatano-Sasa entropy production with IFT (`thermodynamics.hatano_sasa`)
            - Esposito-Van den Broeck decomposition: maintenance vs. reorganisation (`thermodynamics.esposito`)

            #### Planetary Coupling
            - IEA Energy → CO₂ → Radiative Forcing → ΔT → Ice-Albedo → CREP phase
            - New `planetary-coupling` adapter (weight 1.8)

            #### MetaQuest-Sigillins
            - 4-tier adaptive counterquestion engine (GROUNDING → SYNTHESIS)
            - AI-to-AI `CollaborationSession` protocol
            - Fractal singularity awareness at φ = 0.618

            #### Collapse Detector
            - Euler-Maruyama SDE with Tainter driving + Prigogine dissipation
            - Fractal singularity separatrix at φ = 0.618
            - Monte Carlo ensemble analysis

            #### Reactivated Adapters
            - `NukleonScannerAdapter` v2.0.0 — QCD running coupling αs + QGP confinement
            - `GreekMathAdapter` v2.0.0 — Pythagorean harmonics + golden section + Platonic solids

            #### Test Offensive: 800+ Tests
            - Thermodynamic contract tests (Landauer, Hatano-Sasa, Esposito)
            - Planetary validation tests (causal chain consistency)
            - MetaQuest epistemic tests
            - Collapse detector parametric tests

            ### Scientific References
            - Landauer (1961) · Hatano & Sasa (2001) · Esposito & Van den Broeck (2010)
            - Prigogine (1978) · Tainter (1988) · Myhre et al. (1998) · IEA (2024)
          files: dist/*
          draft: false
          prerelease: false

  # ── PyPI Publish ─────────────────────────────────────────────────────────────
  pypi:
    name: Publish to PyPI (OIDC)
    runs-on: ubuntu-latest
    needs: github-release
    environment:
      name: pypi
      url: https://pypi.org/project/unified-mandala/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-v0.3.0
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── Zenodo Deposit ────────────────────────────────────────────────────────────
  zenodo:
    name: Zenodo DOI update (manual step reminder)
    runs-on: ubuntu-latest
    needs: pypi
    steps:
      - uses: actions/checkout@v4
      - name: Verify .zenodo.json
        run: |
          python -c "
          import json, sys
          with open('.zenodo.json') as f:
              z = json.load(f)
          assert z['version'] == '0.3.0', f'Expected 0.3.0, got {z[\"version\"]}'
          assert 'references' in z, 'Missing references'
          print('✔ .zenodo.json validated for v0.3.0')
          print(f'  Title: {z[\"title\"]}')
          print(f'  Keywords: {len(z[\"keywords\"])} keywords')
          print(f'  References: {len(z[\"references\"])} citations')
          "
      - name: Remind about Zenodo
        run: |
          echo "📌 Zenodo deposit: https://doi.org/10.5281/zenodo.19184798"
          echo "   → Create new version at: https://zenodo.org/deposit"
          echo "   → Upload dist/ artifacts and confirm DOI"
