name: auto-provenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existingSourceLabels = (pr.labels || [])
              .map(label => label.name)
              .filter(name => name.startsWith('source:'));

            if (existingSourceLabels.length === 1 && existingSourceLabels[0] !== 'source:human-docs') {
              core.info(`Respecting existing provenance label: ${existingSourceLabels[0]}`);
              return;
            }

            const { data: commits } = await github.rest.pulls.listCommits({
              owner,
              repo,
              pull_number: pr.number,
              per_page: 250,
            });
            const botCommit = commits.some(({ author, commit }) => {
              if (author && author.type === 'Bot') return true;
              return /codex|chatgpt|assistant|openai/i.test(commit.message);
            });

            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: pr.number,
              per_page: 250,
            });

            const docsOnly = files.length > 0 && files.every(file =>
              /^(docs\/|analysis\/|out\/|\.github\/|MandalaMap|codexfeedback|CHANGELOG|README)/.test(file.filename)
            );

            let label = 'source:human';
            if (botCommit) {
              label = 'source:external-ai';
            } else if (docsOnly) {
              label = 'source:human-docs';
            }

            for (const name of existingSourceLabels) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
              } catch (error) {
                core.debug(`Unable to remove label ${name}: ${error.message}`);
              }
            }

            core.info(`Applying provenance label: ${label}`);
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.number,
              labels: [label],
            });
