name: Prompt Lint
on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'src/prompt/**'
jobs:
  prompt_coach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prompts:coach || true
      - name: Upload prompt diffs
        uses: actions/upload-artifact@v4
        with:
          name: prompt-diffs
          path: prompts/.diff
      - name: Post summary
        run: |
          echo "### Prompt Coach (dry-run)" >> $GITHUB_STEP_SUMMARY
          echo "Artefakte: prompt-diffs" >> $GITHUB_STEP_SUMMARY
