name: CI

on: [push, pull_request]

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: npx pyright

  typechecks_and_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci

  adapters_offline:
    runs-on: ubuntu-latest
    env: { CI: "true" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip
      - run: pip install numpy==1.26.4 scipy==1.11.4 netCDF4==1.6.5 xarray==2024.3.0 pandas==2.1.4 python-dotenv==1.0.1
      - name: Cache adapter artifacts
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed
          key: ${{ runner.os }}-adapters-${{ hashFiles('src/adapters/**') }}
      - run: CI=true pnpm adapter:build:oisst
      - run: CI=true pnpm adapter:build:era5
      - run: PYTHONPATH=src pytest -q tests/adapters
