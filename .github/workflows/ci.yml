name: CI

on: [push, pull_request]

env:
  NODE_VERSION: "20"
  ALLOW_NET: "0"

jobs:
  typechecks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -p tsconfig.json --noEmit
      - run: pnpm test:ts

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: npx pyright

  adapters-offline:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      PYTHONPATH: "src"
      ALLOW_NET: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm adapter:build:oisst
      - run: PYTHONPATH=src pytest -q tests/adapters

  stac-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - run: pnpm install --frozen-lockfile
      - run: pnpm stac:validate && pnpm stac:validate:item out/**/*.stac.json || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: stac-invalid, path: out/**/*.stac.json }

  prompt-lint:
    runs-on: ubuntu-latest
    env:
      ALLOW_NET: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prompts:coach --dry

