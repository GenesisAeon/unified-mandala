name: CI

on: [push, pull_request]

env:
  NODE_VERSION: "20"
  ALLOW_NET: "0"
  LOW_MEM: "1"
  VITE_LOW_MEM: "on"

jobs:
  adapters-offline:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      PYTHONPATH: "src"
      ALLOW_NET: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Build OISST (full pipeline)
        run: pnpm adapter:build:oisst
      - name: Smoke: adapters_index.json contains OISST
        run: |
          test -f out/adapters_index.json
          node -e "const x=require('./out/adapters_index.json'); if (!x.adapters?.some(a=>a.kind==='oisst')) process.exit(2)"

  type-and-tests:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      VITEST_WORKERS: "1"
      LOW_MEM: "1"
      VITE_LOW_MEM: "on"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: pnpm install --frozen-lockfile
      - name: TypeScript compile
        run: npx tsc -p tsconfig.json --noEmit
      - name: Vitest (low-memory)
        run: pnpm test:ts:ci
      - name: Pyright
        run: npx pyright

  stac-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - run: pnpm install --frozen-lockfile
      - run: pnpm stac:validate && pnpm stac:validate:item out/**/*.stac.json || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: stac-invalid, path: out/**/*.stac.json }

  prompt-lint:
    runs-on: ubuntu-latest
    env:
      ALLOW_NET: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prompts:coach --dry

