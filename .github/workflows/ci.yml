name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Start OTel Collector
        run: |
          docker run -d --name otel-collector -p 4317:4317 \
            -v ${{ github.workspace }}/.github/otel-collector-config.yaml:/etc/otelcol/config.yaml \
            otel/opentelemetry-collector:0.92.0
      - uses: actions/setup-node@v2
        with:
          node-version: '18'
      - run: pnpm install
      - run: pnpm run update:code-todos
      - run: pnpm run validate:todos
      - run: pnpm audit --audit-level=moderate
      - run: pnpm --filter ./packages/crep-engine run lint test build
      - run: pnpm --filter ./packages/unifiedmandala-ui run lint test build
      - run: pnpm --filter ./packages/genesis-sigillin-core run lint test build
      - run: pnpm --filter ./packages/gpt-bridges run lint test
      - run: pnpm --filter ./packages/cli-tools run lint test
      - run: pnpm test
      - run: sh ci/helm/helm.test.sh
      - run: pnpm run docs:build
      - name: Stop OTel Collector
        if: always()
        run: |
          docker stop otel-collector
          docker rm otel-collector
