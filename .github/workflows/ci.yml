name: CI

on: [push, pull_request]

jobs:
  node_ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'pnpm' }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci
      - run: pnpm resonance:calc

  python_adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
      - run: pip install -r requirements.txt || pip install -r src/adapters/requirements.txt
      - name: OISST offline build
        env:
          CI: "true"
        run: pnpm adapter:build:oisst
      - name: ERA5 dotenv smoke
        run: python -c "from adapters.era5.fetch import load_dotenv; print('dotenv-ok')"

  stac_gate:
    runs-on: ubuntu-latest
    needs: [python_adapters]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm stac:validate
