name: CI
on: [push, pull_request]

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install numpy xarray netCDF4 pandas pyarrow
      - run: npx pyright

  oisst:
    needs: pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install numpy xarray netCDF4 pandas pyarrow
      - run: pnpm adapter:build:oisst

  sigils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install
      - run: pnpm sigils:index:strict
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sigils-errors
          path: out/sigils_errors*.json
