name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.6 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: TypeScript + Sigils
        run: pnpm test:ts && pnpm sigils:index:strict
      - name: Python setup
        uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install -r src/adapters/era5/requirements.txt pytest
      - name: ERA5 adapter (no network)
        run: |
          if [ -z "${{ secrets.CDS_API_KEY }}" ]; then
            echo "⚠️ Skipping live fetch; using fixtures"
            pytest -q
          else
            echo "CDS_API_KEY=${{ secrets.CDS_API_KEY }}" >> .env
            pnpm adapter:build:era5 && pytest -q
          fi
