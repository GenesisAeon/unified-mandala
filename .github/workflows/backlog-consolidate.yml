name: Backlog Consolidate

on:
  push:
    paths:
      - 'advancedToDo_parts/**'
      - 'scripts/meta/backlog-consolidate.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable corepack & install
        run: |
          corepack enable
          corepack prepare pnpm@10.17.0 --activate
          pnpm install --frozen-lockfile

      - name: Run backlog:consolidate
        run: pnpm backlog:consolidate

      - name: Upload artifact (backlog outputs)
        uses: actions/upload-artifact@v4
        with:
          name: backlog-artifacts
          path: |
            out/backlog/**
            advancedprogress.json
          if-no-files-found: warn
