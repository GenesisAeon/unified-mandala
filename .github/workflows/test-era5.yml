name: ERA5 Adapter Tests
on:
  pull_request:
    paths:
      - 'src/adapters/era5/**'
      - 'tests/adapters/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r src/adapters/era5/requirements.txt pytest
      - run: pytest -q tests/adapters/test_era5.py
