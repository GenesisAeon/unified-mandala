name: Meta Learner

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
            - run: pnpm install
      - run: pnpm test -- MetaLearnerAgent .github/workflows/storybook-deploy.yml
