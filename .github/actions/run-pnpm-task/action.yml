name: Run pnpm task
description: Setup Node and pnpm before executing a workspace command
inputs:
  node-version:
    description: Node version to use when running the task
    default: lts/*
  task:
    description: 'pnpm task to execute (for example: lint or -F pkg build)'
    required: true
  cwd:
    description: Working directory for the command
    default: .
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Use Node ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.cwd }}
      run: pnpm install --frozen-lockfile
    - name: Run pnpm task
      shell: bash
      working-directory: ${{ inputs.cwd }}
      run: pnpm --if-present ${{ inputs.task }}
