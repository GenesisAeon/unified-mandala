summary:
  - 'Vitest aliasiert `@opentelemetry/api` auf einen leichten Stub (`tests/__mocks__/otel-api.ts`), damit Unit-Tests ohne echte OTel-ESM-Abhängigkeit laufen.'
  - '`tests/setup/ci.ts` setzt `VERIFY_GATE_SSRF_ALLOWLIST=http://127.0.0.1:*,http://localhost:*` und `VERIFY_GATE_ALLOW_PROTOCOLS=http` als Loopback-Defaults für Vitest.'
  - '`apps/verify-gate/src/security/ssrf.ts` akzeptiert Protokoll-/Port-Wildcards und mappt Loopback-Adressen korrekt auf Allowlist-Einträge; neue Vitest prüft die Wildcard.'
  - '`apps/api/src/middleware/verifyEthics.ts` erzwingt HS256 + `clockTolerance: 5` für JWT-Verdicts und reduziert flakey 428-Fehler; DevTalk105-Evaluation dokumentiert die Maßnahmen.'
