summary:
  - '`apps/ethics-api/src/index.ts` integriert Circuit-Breaker, Fail-Closed-Response (`ETHICS_DEP_FAIL_MODE`), Prometheus (`ethics_dependency_unreachable_total`, `boundary_circuit_state`), `/readyz` sowie einen Shared `fetchJson`-Client mit Timeout/Retry.'
  - '`apps/ethics-api/src/boundary-client.ts`/`circuit-breaker.ts`/`http-client.ts` kapseln Circuit-State & JSON-Fetch (Jitter-Backoff) für Boundary/RAG-Aufrufe.'
  - '`apps/verify-gate/src/index.ts` leitet Authorization/Cookie-Header weiter, setzt `x-ethics-verdict`/`x-ethics-evidence-count`, filtert Hop-by-Hop-Header und liefert 5xx bei Ethics-Ausfällen (Timeout via `VERIFY_GATE_TIMEOUT_MS`).'
  - 'Vitest/Supertest (`apps/ethics-api/src/__tests__/ethics-failclosed.test.ts`, `apps/verify-gate/src/__tests__/proxy-headers.test.ts`) sichern Fail-Closed- & Proxy-Flows; `.env.example`, Stabilization-Playbook (MD/YAML), MandalaMap.(md|json|yaml) und codexfeedback.* spiegeln das Update.'
