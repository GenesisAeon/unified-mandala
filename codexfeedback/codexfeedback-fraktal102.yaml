summary:
  - '`apps/ethics-api/src/index.ts` validiert eingehende Payloads via Ajv (`EthicsCheckSchema`), erzwingt `x-request-id`, koppelt `/readyz` direkt an den Circuit-State (`cb` 0/1/2) und reicht optionale Service-Bearer (`INTERNAL_BEARER`) über den Boundary/RAG-Client weiter.'
  - '`apps/verify-gate/src/index.ts` ergänzt JSON-/Rate-Limits (`GATE_JSON_LIMIT`, `VERIFY_RATE_RPS`), SSRF-Allowlist (`VERIFY_UPSTREAM_ALLOWLIST`, `VERIFY_STRICT_SAME_HOST`), Streaming-Proxying ohne Buffering sowie `Access-Control-Expose-Headers` für `x-ethics-*`.'
  - 'UI zeigt Ethics-Verdicts via `EthicsBadge` + `fetchJsonWithEthics`, Live-Smoke prüft Health/Verify/Ethics/Chat, Grafana enthält `grafana/dashboards/mandala-ethics-gate.json`; Stabilization-Playbook, MandalaMap & `.env.example` spiegeln den Lauf.'
