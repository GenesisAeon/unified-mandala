fraktal: 106
status: done
owner: Johann
summary:
  - '`apps/verify-gate/src/index.ts` nutzt das neue `metrics.ts` (Counter `verify_gate_idem_hits_total`, `verify_gate_ssrf_block_total{host}`, `verify_gate_token_fail_total{reason}`, Histogram `verify_gate_upstream_duration_ms{method,route,code}`), trackt SSRF-Denies & Token-Sign-Fehler und reagiert fail-closed bei Secret-Problemen.'
  - '`apps/verify-gate/src/verdictToken.ts` + `apps/api/src/middleware/verifyEthics.ts` rotieren Verdict-Tokens via `VERIFY_GATE_JWT_SECRETS`/`VERIFY_GATE_JWT_ACTIVE_KID` (kid-Header) und wählen Secrets kid-basiert oder per Legacy-Fallback; Tests (`ethics-token-guard.test.ts`) decken den Pfad ab.'
  - '`apps/ethics-api/src/opa.ts` wertet Bundles über `ETHICS_OPA_ENABLE`/`ETHICS_OPA_PATH` (Policy `apps/ethics-api/opa/policy.rego`) per execFile/`--stdin-input` aus, liefert `evidence_domains_distinct` an Policies und bleibt beim Timeout fail-closed; `analysis/devtalk106-evaluation.md` dokumentiert den DevTalk-Abgleich.'
  - '`apps/ui/src/components/MandalaAIPlayground.tsx` zeigt EvidenceChips (Domains + Strong-Badges) via neuem `EvidenceChips`-Component; MandalaMap.*, Stabilization-Playbook & codexfeedback.* spiegeln Fraktal106, Nightly (`ci.nightly.yml`) führt Chaos-Drill (`pnpm chaos:ethics --scenario boundary-down`) aus.'
  - '`scripts/chaos/ethics-chaos.mjs` erhält CLI-Szenarien (Boundary-Kill via `lsof`, Fail-Closed-Assert), Nightly-Workflow startet Stack + Drill; Docs (`docs/roadmap/v1.0-stabilization-playbook.*`) und `analysis/devtalk106-evaluation.md` verankern den Lauf.'
