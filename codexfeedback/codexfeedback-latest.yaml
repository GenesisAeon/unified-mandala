  status: 'stableBoundaryEventKey canonicalizes payloads; boundary-service schreibt Snapshots atomar und liefert boundary_http_responses_total für Alert-Splitting.'
  next_hook: 'Canonical helper auf verbleibende Publisher/Exporter ausrollen und Prometheus Alerts (Dedupes/min vs. 202/409) beobachten.'
