  - file: packages/boundary-core/src/event-key.ts
    desc: stableBoundaryEventKey nutzt kanonische Payload-Serialisierung für deterministische Hashes.
  - file: packages/boundary-core/src/index.ts
    desc: Exportiert canonicalizePayload für Downstream-Consumer.
  - file: packages/boundary-core/src/canonical.ts
    desc: Helper sortiert Schlüssel rekursiv, schützt Zyklen und wandelt Sonderwerte (Infinity) deterministisch.
  - file: packages/boundary-core/src/__tests__/event-key.test.ts
    desc: Vitest verifiziert gleiche Hashes bei Schlüssel-Umsortierung und kreisenden Payloads.
  - file: docs/roadmap/v1.0-stabilization-playbook.(md|yaml)
    desc: Observability-Stream ergänzt Canonical-Hardening (Atomics + HTTP-Status-Counter).
  - file: MandalaMap.(md|json|yaml)
    desc: Meta auf Fraktal96 aktualisiert, Automation-Cluster referenziert Canonical Hardening & boundary-service Link.
  - file: docs/fraktal/codexfeedback/codexfeedback-fraktal96.yaml
    desc: Log-Eintrag für diesen Lauf inkl. Canonical-Hardening Hook.
  - file: codexfeedback.(md|json|yaml)
    desc: Tracker heben Fraktal96 als abgeschlossen hervor; Hook verweist auf Alert-Monitoring.
  - file: codexfeedback/codexfeedback-latest.(md|json|yaml)
    desc: Latest-Summary an Canonical Hardening angepasst.
