[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "unified-mandala"
version = "0.2.0"
description = "Holistic self-reflecting Mandala framework with CREP, Sigillin, and full GenesisAeon integration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "GenesisAeon Contributors", email = "genesis@aeon.dev" },
]
keywords = [
  "mandala", "crep", "sigillin", "entropy", "governance",
  "emergence", "holistic", "genesis-aeon", "cosmology", "ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.6.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "networkx>=3.2.0",
  "loguru>=0.7.2",
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
  "toml>=0.10.2",
]

[project.optional-dependencies]
full-stack = [
  "pandas>=2.2.0",
  "xarray>=2024.1.0",
  "matplotlib>=3.8.0",
  "plotly>=5.18.0",
  "requests>=2.31.0",
  "aiohttp>=3.9.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
]
gui = [
  "gradio>=4.20.0",
  "streamlit>=1.32.0",
]
sonify = [
  "sounddevice>=0.4.6",
  "numpy>=1.26.0",
]
dev = [
  "pytest>=8.1.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.14.0",
  "pytest-xdist>=3.5.0",
  "mypy>=1.9.0",
  "ruff>=0.3.0",
  "mkdocs>=1.5.3",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.24.0",
  "mkdocs-autorefs>=1.0.0",
  "hatch>=1.9.0",
]

[project.scripts]
unified-mandala = "unified_mandala.cli.rituals:app"

[project.urls]
Homepage = "https://github.com/GenesisAeon/unified-mandala"
Documentation = "https://genesisaeon.github.io/unified-mandala"
Repository = "https://github.com/GenesisAeon/unified-mandala"
"Bug Tracker" = "https://github.com/GenesisAeon/unified-mandala/issues"
Zenodo = "https://doi.org/10.5281/zenodo.unified-mandala"

[tool.hatch.build.targets.wheel]
packages = ["src/unified_mandala"]

[tool.hatch.envs.default]
dependencies = ["unified-mandala[dev,full-stack]"]

[tool.hatch.envs.default.scripts]
test = "pytest tests/ -v --cov=unified_mandala --cov-report=term-missing --cov-fail-under=99"
lint = "ruff check src/ tests/"
fmt = "ruff format src/ tests/"
typecheck = "mypy src/unified_mandala"
docs = "mkdocs build --strict"

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]
per-file-ignores = { "tests/**" = ["S101", "S105", "S106"] }

[tool.ruff.lint.isort]
known-first-party = ["unified_mandala"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
  "unit: pure unit tests",
  "integration: integration tests with adapters",
  "e2e: end-to-end cycle tests",
  "governance: policy gate tests",
  "contract: contract tests between packages",
  "slow: tests that take >1 s",
]

[tool.coverage.run]
source = ["unified_mandala"]
branch = true
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
fail_under = 99
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
